  catch(e){toast('This browser blocked the download; use Copy backup instead.');}
}
async function copyBackup(){try{await navigator.clipboard.writeText(backupJSON());toast('Backup copied. Paste it into a .json file to keep it.');}catch(e){toast('Copying was blocked by the browser.');}}
function importBackup(file){
  const fr=new FileReader();
  fr.onload=()=>{let d;try{d=JSON.parse(fr.result);if(d.app!=='rewind-poker'||!d.S||!Array.isArray(d.hands))throw 0;}catch(e){toast('That file is not a Rewind backup.');return;}
    confirmBox(`Replace the data here with this backup from ${String(d.exportedAt||'').slice(0,10)||'an earlier session'}: ${d.hands.length} hands and ${(d.S.journal||[]).length} reviews?`,'Restore backup',async()=>{
      clearTimer();
      Object.assign(S,JSON.parse(JSON.stringify(d.S)));if(!Array.isArray(S.journal))S.journal=[];
      HANDS=[];mergeHands(d.hands);await IDB.clear();HANDS.forEach(saveHand);save();G=null;hydrate();UI.mode='idle';UI.review=null;UI.drills=null;render();toast(`Restored ${HANDS.length} hands.`);});};
  fr.readAsText(file);
}
function confirmBox(msg,label,onYes){
  const ov=$('#overlay');ov.innerHTML=`<div class="overlay"><div class="modal" role="dialog" aria-modal="true"><h2 style="font-size:24px">Are you sure?</h2><p></p><div class="rowbtns"><button class="go" id="cfYes"></button><button class="ghost" id="cfNo">Cancel</button></div></div></div>`;
  ov.querySelector('p').textContent=msg;$('#cfYes').textContent=label;$('#cfNo').onclick=()=>{ov.innerHTML='';};$('#cfYes').onclick=()=>{ov.innerHTML='';onYes();};
}
async function eraseAll(){
  clearTimer();try{localStorage.removeItem(LS);}catch(e){}await IDB.clear();
  if(DB&&UID){try{const q=await DB.collection('data/users/'+UID).get();for(const d of q.docs){await DB.collection('data/users/'+UID).doc(d.id).delete();}}catch(e){}}
  HANDS=[];S.queue=[];S.deferred=[];S.journal=[];S.reviews=0;S.pending=null;for(const k in S.skills)S.skills[k]={att:0,miss:0,recent:[]};
  newTable();hydrate();UI.mode='idle';UI.review=null;UI.drills=null;render();toast('All saved data erased. New table ready.');
}

/* ---------- the You tab: what your saved play says ---------- */
function renderYou(p){
  const hs=HANDS,n=hs.length;
  if(!n){p.innerHTML='<p class="muted">Play a few hands: your results, habits and review journal build up here and stay between visits.</p>';return;}
  const o=observe('You',hs,{classify:false}),net=hs.reduce((a,r)=>a+(r.result.net[0]||0),0);
  const byPos={};for(const r of hs){const ps=r.players[0].pos;const b=byPos[ps]=byPos[ps]||{n:0,net:0};b.n++;b.net+=r.result.net[0]||0;}
  let sdWon=0,sd=0;for(const r of hs){if(r.result.type!=='showdown'||!r.log.some(e=>e.seat===0)||r.log.some(e=>e.seat===0&&e.type==='fold'))continue;sd++;if(r.result.pots.some(pt=>pt.winners.includes(0)))sdWon++;}
  const rp=(a,b)=>b?Math.round(100*a/b)+'%':'–';
  let h=`<h3 class="sec">Results</h3><div class="hud"><div class="stats"><div>${n}<small>Hands</small></div><div class="${net>0?'net pos':net<0?'net neg':''}">${net>0?'+':''}${net}<small>Chips</small></div><div>${(net/BB_AMT/n*100).toFixed(0)}<small>bb/100</small></div><div>${rp(o.vpip,n)}<small>VPIP</small></div><div>${rp(o.pfr,n)}<small>PFR</small></div></div>
    <div class="stats" style="margin-top:8px"><div>${o.calls?(o.bets/o.calls).toFixed(1):o.bets?'∞':'–'}<small>Aggr.</small></div><div>${rp(o.folds,o.faced)}<small>Fold to bet</small></div><div>${rp(o.wtsd,o.sawFlop)}<small>Showdown</small></div><div>${rp(sdWon,sd)}<small>Won at SD</small></div><div>${o.sawFlop}<small>Flops</small></div></div>
    <p class="muted" style="font-size:14px;margin:8px 0 0">Results swing a lot over a few hundred hands; your review record below says more about your decisions.</p></div>`;
  h+=`<h3 class="sec">By position</h3>${PRE_ORDER.map(ps=>{const b=byPos[ps];if(!b)return'';return`<div class="skillrow"><div>${ps}<div class="muted">${b.n} hands</div></div><div class="${b.net>0?'net pos':b.net<0?'net neg':''}" style="text-align:right">${b.net>0?'+':''}${b.net} chips<div class="muted">${(b.net/BB_AMT/b.n*100).toFixed(0)} bb/100</div></div></div>`;}).join('')}`;
  const J=S.journal||[];
  if(J.length){
    const rate=(arr,f)=>{const xs=arr.map(f).filter(x=>x!=null);return xs.length?{r:xs.filter(Boolean).length/xs.length,n:xs.length}:null;};
    const last=J.slice(-10),prev=J.slice(-20,-10);
    const rows=[['Count the pot',j=>j.pot],['Calculate the price',j=>j.price],['Infer a range',j=>j.range?j.range.ok:null],['Choose and defend a play',j=>j.play?j.play.ok:null]];
    h+=`<h3 class="sec">Review record</h3>${rows.map(([l,f])=>{const a=rate(last,f),b=rate(prev,f);if(!a)return'';const d=b?a.r-b.r:null;
      return`<div class="skillrow"><div>${l}<div class="muted">last ${a.n}: ${pct(a.r,0)}${b?` · before that ${pct(b.r,0)}`:''}</div></div><div style="text-align:right;font:600 15px var(--f-num)">${d==null?'':d>0.05?'improving':d<-0.05?'slipping':'steady'}</div></div>`;}).join('')}`;
    const habits=[];const slips=J.filter(j=>j.slip).length;if(slips)habits.push(`${slips}× divided by the pot <i>before</i> the call when working out break-even.`);
    const imp=J.reduce((a,j)=>a+(j.range?j.range.imp:0),0);if(imp)habits.push(`${imp} impossible hand${imp===1?'':'s'} picked in range reads (check the cards you can see).`);
    const qn=J.reduce((a,j)=>a+(j.range?j.range.q:0),0);if(qn>=3)habits.push(`${qn} hands picked that no player type would play that way.`);
    const inc=J.filter(j=>j.play&&j.play.consistent===false).length;if(inc)habits.push(`${inc}× chose an action that your own estimate did not support.`);
    const bySpot={};for(const j of J)if(j.play){const k=(j.spot.startsWith('pre')||j.spot==='rfi'?'Preflop':STREETS[j.street][0].toUpperCase()+STREETS[j.street].slice(1))+(j.spot.endsWith('facing')?', facing a bet':j.spot==='rfi'?', first in':', no bet to you');const b=bySpot[k]=bySpot[k]||{n:0,ok:0};b.n++;if(j.play.ok)b.ok++;}
    const weak=Object.entries(bySpot).filter(([,b])=>b.n>=2&&b.ok/b.n<0.5).sort((a,b)=>a[1].ok/a[1].n-b[1].ok/b[1].n);
    weak.forEach(([k,b])=>habits.push(`${k}: ${b.ok} of ${b.n} plays were defensible.`));
    h+=`<h3 class="sec">Recurring mistakes</h3>${habits.length?`<ul style="margin:0;padding-left:18px;font:500 15px/1.45 var(--f-num)">${habits.map(x=>`<li>${x}</li>`).join('')}</ul>`:'<p class="muted">Nothing repeats yet. Patterns show up after a few reviews.</p>'}`;
    h+=`<h3 class="sec">Review journal</h3>${J.slice().reverse().slice(0,40).map((j,i)=>{const r=HANDS.find(x=>x.tableId===j.tableId&&x.hand===j.hand);
      const marks=[j.pot!=null?`pot ${j.pot?'✓':'✗'}`:'',j.price!=null?`price ${j.price?'✓':'✗'}`:'',j.range?`range ${pct(j.range.credit,0)}`:'',j.play?`${j.play.action} ${j.play.ok?'✓':'✗'}`:''].filter(Boolean).join(' · ');
      return`<details class="handrow"><summary>${new Date(j.at).toLocaleDateString(undefined,{month:'short',day:'numeric'})} · #${j.hand} ${STREETS[j.street]} ${cardsXS(j.hole)} <span class="muted" style="margin-left:auto">${esc(marks)}</span></summary>
        <p style="font:500 15px/1.45 var(--f-num);margin:6px 0">${j.board&&j.board.length?cardsXS(j.board)+' · ':''}${j.pos}${j.vname?' vs '+esc(j.vname):''}${j.play?` · you chose ${esc(j.play.action)}${j.play.size?' '+esc(j.play.size):''} at ${esc(j.play.est)}%; best vs him: ${esc(j.play.best)}`:''}</p>
        <p class="muted" style="font-size:15px;margin:4px 0 8px">${esc(j.takeaway)}</p>${r?`<button class="btn2" data-jh="${j.hand}" data-jt="${esc(j.tableId)}" data-jk="${j.k}">Review it again</button>`:''}</details>`;}).join('')}`;
  }else h+=`<h3 class="sec">Review record</h3><p class="muted">Your first review starts the journal: every answer, the right numbers and the takeaway are kept here.</p>`;
  p.innerHTML=h;
  p.querySelectorAll('button[data-jh]').forEach(b=>b.onclick=()=>{if(G&&!G.over&&UI.mode==='play'){toast('Finish the current hand first.');return;}const r=HANDS.find(x=>x.tableId===b.dataset.jt&&x.hand===+b.dataset.jh);if(r)startReview(r,+b.dataset.jk,false);});
}

/* ---------- misc ---------- */
function toast(msg){clearTimeout(UI.toastT);let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t);}t.textContent=msg;t.hidden=false;UI.toastT=setTimeout(()=>{t.hidden=true;},2600);}
function renderHeader(){
  const hs=tableHands(),net=hs.reduce((a,r)=>a+(r.result.net[0]||0),0);
  const block=hs.filter(r=>r.hand>S.blockStart).length;
  $('#status').textContent=S.tableId?`Hand #${G&&G.handNo||S.handNo} · blinds 1/2 · review every ${S.settings.interval} hand${S.settings.interval>1?'s':''}${UI.mode==='play'||UI.mode==='between'?` (${Math.max(0,S.settings.interval-block)} to go)`:''}`:'';
  const np=$('#netPill');np.textContent=`Session ${net>0?'+':''}${net} chips`;np.className='pill net '+(net>0?'pos':net<0?'neg':'');
  const due=dueItems().length,dp=$('#duePill');dp.hidden=!due;dp.textContent=`${due} due review${due===1?'':'s'}`;
  dp.onclick=()=>{if(G&&!G.over&&UI.mode==='play'){toast('Finish the current hand first.');return;}if(UI.mode==='review'){toast('Finish this review first.');return;}startDrills(false);};
}
function render(){
  $('#app').classList.toggle('reviewing',UI.mode==='review'||UI.mode==='drill');
  renderHeader();renderTable();renderActionBar();renderSide();
}
function welcome(saved){
  const ov=$('#overlay');
  const due=dueItems().length;
  ov.innerHTML=`<div class="overlay"><div class="modal"><h2>${saved?'Welcome back':'Sit down at a six-handed table'}</h2>
    <p>${saved?`Your table, ${tableHands().length} saved hand${tableHands().length===1?'':'s'} and ${due} due review${due===1?'':'s'} are here.`:'Blinds 1/2, 200-chip stacks, five opponents with their own tendencies. You play a couple of hands, then the coach rewinds to one decision and asks two or three short questions.'}</p>
    <p class="sub">Keys: F fold · C check or call · R bet or raise. Flag any decision with one click.</p>
    <div class="rowbtns"><button class="go" id="wGo">${saved?'Continue':'Sit down'}</button>${due?'<button class="ghost" id="wDue">Do due reviews first</button>':''}</div></div></div>`;
  $('#wGo').onclick=()=>{ov.innerHTML='';if(S.pending){const p=S.pending;const r=HANDS.find(x=>x.tableId===p.tableId&&x.hand===p.hand);if(r){startReview(r,p.k,false);return;}}dealHand();};
  if($('#wDue'))$('#wDue').onclick=()=>{ov.innerHTML='';startDrills(false);};
}
async function boot(){
  const ls=lsLoad();if(ls&&ls.S){Object.assign(S,ls.S);HANDS=ls.H||[];}
  $('#overlay').innerHTML=`<div class="overlay"><div class="modal"><h2>Loading your table…</h2><p class="sub">Checking for saved hands and due reviews.</p></div></div>`;
  let done=false;const fin=()=>{if(done)return;done=true;BOOTED=true;if(!S.tableId)newTable();hydrate();UI.mode='idle';render();welcome(tableHands().length>0||S.queue.length>0);};
  setTimeout(fin,6000);
  try{mergeHands(await IDB.all());}catch(e){}
  try{await initStore();}catch(e){}
  fin();
}
window.addEventListener('resize',()=>{});
function autoplay(n){ // test helper: the hero is played by the solid-regular model, instantly
  if(!G)hydrate();
  for(let t=0;t<n;t++){G.startHand();
    while(!G.over){const s=G.actor;
      if(G.s[s].isHero){const snap=G.heroSnapshot(s);G.heroDecisions.push(snap);const a=G.botDecide(s);G.decisions.pop();const n0=G.log.length;G.act(s,a.type,a.to);const e=G.log[n0];snap.action={type:e.type,to:e.to,amount:e.amount};}
      else{const a=G.botDecide(s);G.act(s,a.type,a.to);}}
    const rec=makeRecord(G,0);rec.tableId=S.tableId;for(let s=1;s<6;s++){const ll=handLL(rec,s);if(ll)rec.ll[rec.players[s].name]=ll;}HANDS.push(rec);saveHand(rec);}
  S.players.forEach((p,i)=>p.stack=G.players[i].stack);S.button=G.button;S.handNo=G.handNo;S.blockStart=G.handNo;save();render();
}
window.__rewind={S,UI,autoplay,get G(){return G;},get HANDS(){return HANDS;},dealHand,heroAct,startReview,startDrills,render};
boot();
}
