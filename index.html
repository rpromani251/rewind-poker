<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rewind Poker Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/*
VOICE: a card room at night; quiet, exact, a coach who shows the arithmetic.
IDEA: an online poker client's table beside a coach's ruled notebook.
PICTURE: the live felt table itself, large, with readable four-colour cards.
COLOUR and TYPE: walnut rail and deep felt, chip red for action, paper-white notebook; Barlow Semi Condensed for chips and labels, Barlow for prose.
LAYOUT: table left, notebook right; in review the notebook widens; stacks under 900px.
*/
:root{color-scheme:dark;--room:#0c1110;--room2:#141b19;--felt:#11603f;--felt2:#0a3c28;--rail:#3a2416;--rail2:#5b3b26;
  --ink:#eef1ee;--mute:#9fb0a8;--line:#24302c;--chip:#c7362f;--chip2:#e04a3f;--go:#1f8a55;--go2:#26a466;--slate:#3a4743;
  --paper:#f4f5f1;--pink:#17201d;--pmute:#5b6661;--pline:#dfe3dc;--accent:#c7362f;--good:#1d7a4c;--bad:#b3322b;--warn:#a86a12;
  --c-s:#1b1d1c;--c-h:#c62f2f;--c-d:#1f5fc4;--c-c:#16804a;
  --f-num:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;--f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--room);color:var(--ink);font:16px/1.5 var(--f-body);overflow-x:clip}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #f0d27a;outline-offset:2px}
.app{display:grid;grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:auto minmax(0,1fr);height:100vh;min-height:620px}
.app.reviewing{grid-template-columns:minmax(0,1fr) minmax(480px,44vw)}
header.top{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--room2)}
.brand{font:600 20px/1 var(--f-num);letter-spacing:.2px;display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.brand small{font:500 14px var(--f-num);color:var(--mute)}
.status{font:500 15px var(--f-num);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .grow{flex:1}
.pill{font:600 14px var(--f-num);padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:#1a2421;white-space:nowrap}
.pill.due{border-color:#7a2a24;background:#2a1714;color:#ffb3aa}
.pill.btn:hover{background:#22302c}
.net.pos{color:#7fe0a8}.net.neg{color:#ff9a8f}

/* ---------- table ---------- */
.stage{display:flex;flex-direction:column;min-height:0;padding:14px 18px 12px;gap:10px}
.table-area{position:relative;flex:1;min-height:340px;max-height:640px}
.felt{position:absolute;inset:7% 9% 9%;border-radius:999px;background:radial-gradient(ellipse at 50% 40%,#1a7a52 0%,var(--felt) 45%,var(--felt2) 100%);
  box-shadow:0 0 0 14px var(--rail),0 0 0 16px var(--rail2),0 0 0 17px #000,0 30px 60px rgba(0,0,0,.6),inset 0 0 60px rgba(0,0,0,.45)}
.felt::after{content:'';position:absolute;inset:16px;border-radius:999px;border:1px solid rgba(255,255,255,.07)}
.center{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:2}
.potlabel{font:600 17px var(--f-num);background:rgba(0,0,0,.35);padding:3px 12px;border-radius:999px;white-space:nowrap}
.potlabel.hidden{color:#f0d27a}
.board{display:flex;gap:6px;min-height:82px}
.slot{width:58px;height:82px;border-radius:7px;border:1px dashed rgba(255,255,255,.12)}
.card{width:58px;height:82px;border-radius:7px;background:#fbfbf8;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;
  box-shadow:0 2px 0 rgba(0,0,0,.25),0 6px 14px rgba(0,0,0,.35);font-family:var(--f-num);position:relative;user-select:none}
.card b{font-size:32px;font-weight:700;letter-spacing:-1px}.card i{font-style:normal;font-size:24px;margin-top:2px}
.card.sm{width:40px;height:56px;border-radius:5px}.card.sm b{font-size:22px}.card.sm i{font-size:16px}
.card.xs{width:28px;height:38px;border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.3)}.card.xs b{font-size:16px}.card.xs i{font-size:12px;margin:0}
.card.s-s{color:var(--c-s)}.card.s-h{color:var(--c-h)}.card.s-d{color:var(--c-d)}.card.s-c{color:var(--c-c)}
.card.back{background:repeating-linear-gradient(45deg,#7d1f1b 0 6px,#962a24 6px 12px);border:3px solid #f2efe6}
.card.deal{animation:deal .28s ease-out both}
@keyframes deal{from{transform:translateY(-14px) scale(.92);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.card.deal{animation:none}}
.seat{position:absolute;transform:translate(-50%,-50%);z-index:3;display:flex;flex-direction:column;align-items:center;gap:4px;width:150px}
.seat .hole{display:flex;gap:3px;height:56px}
.seat.hero .hole{height:82px}
.plate{background:#0d1513;border:1px solid #2c3a35;border-radius:10px;padding:5px 10px 6px;min-width:128px;text-align:center;box-shadow:0 6px 16px rgba(0,0,0,.4);position:relative}
.seat.acting .plate{border-color:#f0d27a;box-shadow:0 0 0 2px rgba(240,210,122,.35),0 6px 16px rgba(0,0,0,.4)}
.seat.folded{opacity:.42}
.plate .nm{font:600 15px/1.15 var(--f-num);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate .stk{font:600 17px/1.1 var(--f-num);color:#f3e7c3}
.plate .ps{position:absolute;top:-10px;left:8px;font:700 12px/1 var(--f-num);background:#2a3733;color:#cfe0d8;padding:3px 6px;border-radius:5px;letter-spacing:.3px}
.plate .act{position:absolute;top:-10px;right:8px;font:600 12px/1 var(--f-num);background:#f0d27a;color:#231a07;padding:3px 6px;border-radius:5px;white-space:nowrap}
.dealer{position:absolute;width:26px;height:26px;border-radius:50%;background:#f7f4ea;color:#111;font:800 13px/26px var(--f-num);text-align:center;box-shadow:0 2px 4px rgba(0,0,0,.5);z-index:4;transform:translate(-50%,-50%)}
.bet{position:absolute;transform:translate(-50%,-50%);z-index:2;display:flex;align-items:center;gap:6px;font:700 16px var(--f-num);white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.chips{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle,#fff 0 28%,var(--chip) 30% 62%,#fff 64% 70%,var(--chip) 72%);box-shadow:0 2px 0 #6d1a16}
.banner{position:absolute;left:50%;top:66%;transform:translate(-50%,-50%);z-index:5;background:rgba(6,10,9,.88);border:1px solid #39463f;border-radius:12px;padding:10px 16px;text-align:center;font:600 16px/1.35 var(--f-num);max-width:70%}
.banner small{display:block;color:var(--mute);font-weight:500}

/* ---------- action bar ---------- */
.actionbar{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.2fr);gap:14px;align-items:center;background:var(--room2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:76px}
.ab-info{font:500 15px/1.35 var(--f-num);color:var(--mute)}
.ab-info strong{color:var(--ink);font-weight:600}
.ab-btns{display:flex;gap:8px}
.abtn{min-width:104px;min-height:52px;border:0;border-radius:10px;font:700 18px/1.05 var(--f-num);color:#fff;padding:6px 14px;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.abtn small{display:block;font:500 13px var(--f-num);opacity:.85}
.abtn.fold{background:var(--slate)}.abtn.call{background:var(--go)}.abtn.raise{background:var(--chip)}
.abtn.fold:hover{background:#4a5853}.abtn.call:hover{background:var(--go2)}.abtn.raise:hover{background:var(--chip2)}
.abtn:disabled{opacity:.35;cursor:default}
.sizer{display:flex;flex-direction:column;gap:6px}
.sizer .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.preset{min-height:34px;padding:4px 10px;border-radius:8px;border:1px solid #33433d;background:#1b2622;font:600 14px var(--f-num)}
.preset:hover{background:#25332e}
.sizer input[type=range]{flex:1;accent-color:var(--chip)}
.sizer input[type=number]{width:84px;min-height:36px;border-radius:8px;border:1px solid #33433d;background:#0f1715;padding:4px 8px;font:600 16px var(--f-num)}
.hint{font:500 13px var(--f-num);color:var(--mute)}
.flag{min-height:40px;border-radius:9px;border:1px solid #4a3a1a;background:#221b0d;color:#f0d27a;font:600 14px var(--f-num);padding:4px 12px;white-space:nowrap}
.flag.on{background:#f0d27a;color:#2a1f05}
.waitmsg{font:600 16px var(--f-num);color:var(--mute);text-align:center}
.nextbtn{min-height:48px;border-radius:10px;border:0;background:var(--go);color:#fff;font:700 17px var(--f-num);padding:6px 18px}

/* ---------- side panel ---------- */
aside.side{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--room2)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;min-height:44px;background:none;border:0;border-bottom:2px solid transparent;font:600 15px var(--f-num);color:var(--mute)}
.tab.on{color:var(--ink);border-bottom-color:var(--chip)}
.panel{flex:1;overflow:auto;padding:14px 16px 24px}
.loglist{list-style:none;margin:0;padding:0;font:500 15px/1.45 var(--f-num)}
.loglist li{padding:3px 0;border-bottom:1px solid #1d2724;display:flex;gap:8px;align-items:baseline}
.loglist .st{color:#f0d27a;font-weight:700;padding-top:8px;border:0}
.loglist .me{color:#ffd9a8}
.loglist .amt{margin-left:auto;color:var(--mute);white-space:nowrap}
.hud{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:#111917}
.hud h4{margin:0 0 6px;font:600 16px var(--f-num);display:flex;justify-content:space-between;gap:8px}
.hud h4 span{color:var(--mute);font-weight:500}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;font:600 15px var(--f-num);text-align:center}
.stats div small{display:block;font:500 12.5px var(--f-num);color:var(--mute)}
.sd{display:flex;gap:6px;align-items:center;margin-top:6px;font:500 14px var(--f-num);color:var(--mute);flex-wrap:wrap}
.muted{color:var(--mute)}
h3.sec{font:600 17px var(--f-num);margin:18px 0 8px}
h3.sec:first-child{margin-top:0}
.skillrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:8px 0;border-bottom:1px solid var(--line);font:500 15px var(--f-num)}
.dots{display:flex;gap:3px}.dots i{width:9px;height:9px;border-radius:50%;background:#2c3834}.dots i.ok{background:#2fb36f}.dots i.no{background:#e0574d}
.tag{font:700 12px var(--f-num);padding:2px 6px;border-radius:5px;background:#3a1714;color:#ffb3aa;margin-left:6px}
.field{display:flex;align-items:center;gap:8px;margin:8px 0}
.field select,.field input{min-height:40px;border-radius:8px;border:1px solid #33433d;background:#0f1715;padding:4px 8px}
.lnk{background:none;border:0;color:#f0d27a;text-decoration:underline;padding:0;font:inherit}
.btn2{min-height:42px;border-radius:9px;border:1px solid #3a4a44;background:#1b2622;padding:6px 14px;font:600 15px var(--f-num)}
.btn2:hover{background:#24322d}
.handrow{border-bottom:1px solid var(--line);padding:8px 0}
.handrow summary{cursor:pointer;display:flex;gap:8px;align-items:center;font:600 15px var(--f-num);list-style:none}
.handrow summary::-webkit-details-marker{display:none}

/* ---------- coach notebook (light paper) ---------- */
.coach{background:var(--paper);color:var(--pink);flex:1;overflow:auto;padding:18px 20px 40px;font-size:16px}
.coach h2{font:600 26px/1.15 var(--f-num);margin:0 0 6px;text-wrap:balance}
.coach h3{font:600 19px/1.2 var(--f-num);margin:20px 0 8px}
.coach p{margin:6px 0 10px;max-width:70ch}
.coach .sub{color:var(--pmute);font:500 15px/1.4 var(--f-num)}
.coach .steps{display:flex;gap:6px;margin:10px 0 14px}
.coach .steps i{flex:1;height:5px;border-radius:3px;background:var(--pline)}.coach .steps i.on{background:var(--accent)}.coach .steps i.done{background:#8aa898}
.qcard{border:1px solid var(--pline);background:#fff;border-radius:12px;padding:14px 16px;margin:10px 0}
.qcard label{display:block;font:600 16px/1.3 var(--f-num);margin:10px 0 4px}
.qcard input[type=number],.qcard input[type=text],.qcard textarea{width:100%;min-height:44px;border:1px solid #c9cfc6;border-radius:8px;padding:8px 10px;background:#fbfcfa;color:var(--pink);font-size:16px}
.qcard textarea{min-height:78px;resize:vertical;font-family:var(--f-body)}
.inrow{display:flex;gap:8px;align-items:center}.inrow input{max-width:150px}.inrow span{color:var(--pmute);font:500 15px var(--f-num)}
.go{min-height:46px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:700 17px var(--f-num);padding:6px 20px;margin-top:12px}
.go:hover{background:#d8443c}.go:disabled{opacity:.5}
.ghost{min-height:44px;border:1px solid #c9cfc6;border-radius:10px;background:#fff;color:var(--pink);font:600 15px var(--f-num);padding:6px 14px}
.ghost:hover{background:#f0f2ec}
.choice{display:flex;gap:6px;flex-wrap:wrap}
.choice button{min-height:44px;min-width:84px;border:1px solid #c9cfc6;border-radius:9px;background:#fff;font:600 16px var(--f-num);text-transform:capitalize}
.choice button.on{background:var(--pink);color:#fff;border-color:var(--pink)}
.fb{border-left:4px solid var(--pline);padding:8px 12px;margin:10px 0;background:#fff;border-radius:0 10px 10px 0}
.fb.ok{border-color:var(--good)}.fb.no{border-color:var(--bad)}.fb.mid{border-color:var(--warn)}
.fb .v{font:700 15px var(--f-num);letter-spacing:.2px}.fb.ok .v{color:var(--good)}.fb.no .v{color:var(--bad)}.fb.mid .v{color:var(--warn)}
.calc{font:500 16px/1.5 var(--f-num);background:#f0f3ee;border-radius:8px;padding:8px 12px;margin:6px 0}
.calc b{font-weight:700}
.histline{font:500 15px/1.5 var(--f-num);color:#38423e;background:#fff;border:1px solid var(--pline);border-radius:10px;padding:8px 12px;max-height:320px;overflow:auto}
.histline .loglist li{border-color:#eceee9}.histline .loglist .me{color:var(--accent);font-weight:600}.histline .loglist .st{color:#7a5a12}.histline .loglist .amt{color:#5b6661}
.histline div{display:flex;gap:6px}.histline .st{color:var(--accent);font-weight:700;margin-top:4px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.col{border:1px solid var(--pline);background:#fff;border-radius:12px;padding:12px 14px}
.col h4{margin:0 0 4px;font:700 17px var(--f-num)}
.bar{display:grid;grid-template-columns:62px minmax(0,1fr) 56px;gap:8px;align-items:center;font:600 15px var(--f-num);margin:4px 0}
.bar .tr{height:14px;background:#e8ece5;border-radius:7px;overflow:hidden}.bar .tr i{display:block;height:100%;background:var(--pink)}
.bar .tr i.alt{background:#9aa9a1}
.bar .n{text-align:right;white-space:nowrap}
.big{font:700 30px/1.05 var(--f-num)}
.slider{margin:10px 0 4px;position:relative}
.slider input{width:100%;accent-color:var(--accent)}
.flipmark{position:absolute;top:-6px;width:2px;height:30px;background:var(--bad);pointer-events:none}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;font:500 15px var(--f-num)}.kv dt{color:var(--pmute)}.kv dd{margin:0}
details.src{margin-top:8px;font-size:14.5px;color:#38423e}details.src summary{cursor:pointer;font:600 14.5px var(--f-num);color:var(--pmute)}
.chipk{display:inline-block;font:700 13px var(--f-num);padding:2px 6px;border-radius:5px;margin:2px;background:#eef1ec}
.chipk.imp{background:#f8dcd9;color:#8e211b;text-decoration:line-through}.chipk.q{background:#fbe9c8;color:#7a4a05}.chipk.alt{background:#dfe9f6;color:#1d4a87}.chipk.ok{background:#d9efe2;color:#145c37}.chipk.miss{background:#eceee9;color:#38423e;outline:1px dashed #9aa59f}
.take{background:var(--pink);color:#fff;border-radius:12px;padding:14px 16px;margin:14px 0;font:500 17px/1.45 var(--f-body)}
.take b{font:700 14px var(--f-num);letter-spacing:.3px;display:block;color:#f0d27a;margin-bottom:2px}
.cl{background:#fff;border:1px dashed #b9c2bb;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:15.5px;white-space:pre-wrap}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.declist{list-style:none;padding:0;margin:8px 0}.declist li{margin:6px 0}
.declist button{width:100%;text-align:left;min-height:44px;border:1px solid var(--pline);border-radius:10px;background:#fff;padding:8px 12px;font:500 15px var(--f-num)}
.declist button.pick{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}

/* ---------- range grid ---------- */
.gridwrap{margin:8px 0}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tools button{min-height:36px;border:1px solid #c9cfc6;border-radius:8px;background:#fff;font:600 14px var(--f-num);padding:2px 10px}
.tools button.on{background:var(--pink);color:#fff;border-color:var(--pink)}
.grid{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:2px;user-select:none;touch-action:none;max-width:560px}
.cell{aspect-ratio:1/1;border:0;border-radius:4px;background:#e9ece6;font:600 13px/1 var(--f-num);color:#38423e;padding:0;position:relative;overflow:hidden;min-height:30px}
.cell.pr{background:#dfe4dd}.cell.su{background:#ecefe8}
.cell .fill{position:absolute;inset:0;background:var(--accent);opacity:0}
.cell span{position:relative}
.cell.sel{color:#fff}
.cell.down::after{content:'↓';position:absolute;right:2px;top:1px;font-size:11px;color:#1d4a87;font-weight:800}
.cell.blk{background:repeating-linear-gradient(135deg,#e2e5df 0 4px,#f4f5f1 4px 8px);color:#a3aca6}
.cell.heat .fill{background:#17201d}
.cell.ring{box-shadow:inset 0 0 0 2px var(--accent)}
.legend{font:500 14px var(--f-num);color:var(--pmute);margin-top:6px}
.compbars{margin:8px 0}.compbars .bar{grid-template-columns:150px minmax(0,1fr) 92px}

/* ---------- overlay ---------- */
.overlay{position:fixed;inset:0;background:rgba(4,7,6,.72);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--paper);color:var(--pink);border-radius:14px;max-width:560px;width:100%;padding:22px 24px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal h2{font:600 30px/1.1 var(--f-num);margin:0 0 8px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#f4f5f1;color:#17201d;border-radius:10px;padding:10px 16px;font:600 15px var(--f-num);z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:90vw}

@media (max-width:1100px){.app,.app.reviewing{grid-template-columns:minmax(0,1fr) 360px}.two{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .app,.app.reviewing{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto;height:auto}
  aside.side{border-left:0;border-top:1px solid var(--line);min-height:60vh}
  .table-area{min-height:460px}
  .actionbar{grid-template-columns:minmax(0,1fr)}
  .seat{width:110px}.plate{min-width:96px;padding:4px 6px}.card{width:44px;height:62px}.card b{font-size:24px}.card i{font-size:18px}.slot{width:44px;height:62px}.board{min-height:62px}
  .seat .hole{height:42px}.seat.hero .hole{height:62px}.card.sm{width:30px;height:42px}.card.sm b{font-size:17px}.card.sm i{font-size:12px}
}
@media (max-width:600px){.felt{inset:9% 4% 10%}.status{display:none}header.top{flex-wrap:wrap;gap:8px}}

</style></head><body>
<div class="app" id="app">
<header class="top"><div class="brand">Rewind <small>six-handed hold'em coach</small></div><div class="status" id="status"></div><div class="grow"></div><button class="pill btn due" id="duePill" hidden></button><span class="pill net" id="netPill"></span></header>
<main class="stage"><div class="table-area" id="table" aria-label="Poker table"></div><div class="actionbar" id="actionbar"></div></main>
<aside class="side" id="side"></aside>
</div>

<script>

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ---------- evaluator (any 1..7 cards; higher score wins) ---------- */
const _rc=new Int8Array(13), _sm=new Int32Array(4), _sc=new Int8Array(4);
function straightHigh(m){for(let h=12;h>=4;h--){const need=0x1F<<(h-4);if((m&need)===need)return h;}return (m&0x100F)===0x100F?3:-1;}
function topBits(m,n){let out=0,k=0;for(let r=12;r>=0&&k<n;r--){if(m&(1<<r)){out=(out<<4)|r;k++;}}while(k<n){out<<=4;k++;}return out;}
function evalHand(cs){
  _rc.fill(0);_sm.fill(0);_sc.fill(0);let rm=0;
  for(let i=0;i<cs.length;i++){const c=cs[i],r=c>>2,s=c&3;_rc[r]++;_sm[s]|=1<<r;_sc[s]++;rm|=1<<r;}
  for(let s=0;s<4;s++)if(_sc[s]>=5){const m=_sm[s],sh=straightHigh(m);if(sh>=0)return(8<<20)|(sh<<16);return(5<<20)|topBits(m,5);}
  let q=-1,t1=-1,t2=-1,p1=-1,p2=-1;
  for(let r=12;r>=0;r--){const n=_rc[r];if(n===4)q=r;else if(n===3){if(t1<0)t1=r;else if(t2<0)t2=r;}else if(n===2){if(p1<0)p1=r;else if(p2<0)p2=r;}}
  if(q>=0)return(7<<20)|(q<<16)|(topBits(rm&~(1<<q),1)<<12);
  if(t1>=0&&(t2>=0||p1>=0))return(6<<20)|(t1<<16)|(Math.max(t2,p1)<<12);
  const sh=straightHigh(rm);if(sh>=0)return(4<<20)|(sh<<16);
  if(t1>=0)return(3<<20)|(t1<<16)|(topBits(rm&~(1<<t1),2)<<8);
  if(p1>=0&&p2>=0)return(2<<20)|(p1<<16)|(p2<<12)|(topBits(rm&~(1<<p1)&~(1<<p2),1)<<8);
  if(p1>=0)return(1<<20)|(p1<<16)|(topBits(rm&~(1<<p1),3)<<4);
  return topBits(rm,5);
}

{let n=0;for(let a=0;a<52;a++)for(let b=a+1;b<52;b++){CA[n]=a;CB[n]=b;CIDX[a*52+b]=n;CIDX[b*52+a]=n;CCLS[n]=classOfCards(a,b);n++;}}

/* ---------- range strings ---------- */
function _pairK(r){const i=12-r;return i*13+i;}
function _suitK(h,l){return(12-h)*13+(12-l);}

function parseRange(str){
  const w=new Float64Array(169);if(!str)return w;
  for(let tok of str.split(',')){
    tok=tok.trim();if(!tok)continue;let wt=1;const ci=tok.indexOf(':');if(ci>=0){wt=parseFloat(tok.slice(ci+1));tok=tok.slice(0,ci);}
    const set=k=>{w[k]=wt;};
    const one=(t,fn)=>{const h=RANKS.indexOf(t[0]),l=RANKS.indexOf(t[1]),s=t[2]||'';fn(h,l,s);};
    const put=(h,l,s)=>{if(h===l)set(_pairK(h));else{const H=Math.max(h,l),L=Math.min(h,l);if(s!=='o')set(_suitK(H,L));if(s!=='s')set(_offK(H,L));}};
    if(tok.includes('-')){const[a,b]=tok.split('-');const h1=RANKS.indexOf(a[0]),l1=RANKS.indexOf(a[1]),l2=RANKS.indexOf(b[1]),s=a[2]||'';
      if(h1===l1){const lo=Math.min(l1,l2),hi=Math.max(l1,l2);for(let r=lo;r<=hi;r++)set(_pairK(r));}
      else{const lo=Math.min(l1,l2),hi=Math.max(l1,l2);for(let l=lo;l<=hi;l++)put(h1,l,s);}}
    else if(tok.endsWith('+')){const t=tok.slice(0,-1);one(t,(h,l,s)=>{if(h===l){for(let r=h;r<=12;r++)set(_pairK(r));}else{for(let x=l;x<h;x++)put(h,x,s);}});}
    else one(tok,put);
  }
  return w;
}
const R=parseRange;
function pairRange(r,c){const rr=R(r),cc=R(c);for(let k=0;k<169;k++)cc[k]=Math.min(cc[k],1-rr[k]);return{r:rr,c:cc};}

function compileModel(src){

  for(const g of ['ip','sb','bb']){M.vsOpen[g]={};const t=src.vsOpen[g]||{};const fb=t.late||t.early||src.vsOpen.ip.late;
    for(const og of ['early','late','sb']){const pr=t[og]||fb;M.vsOpen[g][og]=pairRange(pr[0],pr[1]);}}
  for(const k of ['vs3bet','cold3bet','vs4bet','cold4bet'])M[k]=pairRange(src[k][0],src[k][1]);
  M.vs5bet=R(src.vs5bet);M.bbIso=R(src.bbIso);M.limpOpen=src.limpOpen?R(src.limpOpen):null;return M;
}

/* A bot = a player type plus private jitter the coach never sees. */
function makeBotModel(type,rnd){
  const t=(rnd()*0.6-0.3), nb=PROFILES[NEIGHBOR[type][t<0?'tight':'loose']], base=PROFILES[type], a=Math.abs(t);
  const M={label:base.label,open:{},vsOpen:{},limpCall:base.limpCall,post:{}};
  for(const p in base.open)M.open[p]=blend(base.open[p],nb.open[p],a);
  for(const g in base.vsOpen){M.vsOpen[g]={};for(const og in base.vsOpen[g]){const x=base.vsOpen[g][og],y=nb.vsOpen[g][og];M.vsOpen[g][og]={r:blend(x.r,y.r,a),c:blend(x.c,y.c,a)};}}
  for(const k of ['vs3bet','cold3bet','vs4bet','cold4bet'])M[k]={r:blend(base[k].r,nb[k].r,a),c:blend(base[k].c,nb[k].c,a)};
  M.vs5bet=blend(base.vs5bet,nb.vs5bet,a);M.bbIso=blend(base.bbIso,nb.bbIso,a);M.limpOpen=base.limpOpen;
  for(const k in base.post)M.post[k]=Math.min(1,Math.max(0,base.post[k]*(1+(rnd()*0.3-0.15))));
  return M;
}
const ISO_POS={UTG:'UTG',HJ:'UTG',CO:'HJ',BTN:'CO',SB:'CO'};
const posGroup=p=>p==='SB'?'sb':p==='BB'?'bb':'ip';
const openerGroup=p=>(p==='UTG'||p==='HJ')?'early':p==='SB'?'sb':'late';

/* preflop policy: returns {fold,call,raise}; 'call' with toCall 0 = check */
function preflopDist(M,k,sit){
  let r=0,c=0;
  switch(sit.role){
    case'unopened':r=M.open[sit.pos]?M.open[sit.pos][k]:0;if(M.limpOpen)c=Math.max(0,M.limpOpen[k]-r)*0.85;break;
    case'limped':
      if(sit.pos==='BB'&&sit.toCall===0){r=M.bbIso[k];c=1-r;}
      else{r=M.open[ISO_POS[sit.pos]||'CO'][k];const o=M.open[sit.pos]?M.open[sit.pos][k]:0;c=Math.max(0,o-r)*M.limpCall;}break;
    case'vsOpen':{const t=M.vsOpen[posGroup(sit.pos)][openerGroup(sit.openerPos)];r=t.r[k];c=t.c[k];break;}
    case'vs3bet':case'cold3bet':case'vs4bet':case'cold4bet':{const t=M[sit.role];r=t.r[k];c=t.c[k];break;}
    default:c=M.vs5bet[k];
  }
  if(!sit.canRaise){c=Math.min(1,c+r);r=0;}
  r=Math.max(0,Math.min(1,r));c=Math.max(0,Math.min(1-r,c));
  return{fold:Math.max(0,1-r-c),call:c,raise:r};
}

/* postflop hand-strength features for every combo on a board (cached) */
const _featCache=new Map();
function boardFeatures(board){
  const key=board.join(',');let F=_featCache.get(key);if(F)return F;
  const hs=new Float32Array(NC),fd=new Uint8Array(NC),oe=new Uint8Array(NC),gs=new Uint8Array(NC),sc=new Int32Array(NC),valid=new Uint8Array(NC);
  const dead=new Uint8Array(52);board.forEach(c=>dead[c]=1);
  const cards=board.slice();cards.push(0,0);const nb=board.length;
  const idx=[];
  for(let i=0;i<NC;i++){if(dead[CA[i]]||dead[CB[i]])continue;valid[i]=1;cards[nb]=CA[i];cards[nb+1]=CB[i];sc[i]=evalHand(cards);idx.push(i);}
  idx.sort((a,b)=>sc[a]-sc[b]);const N=idx.length;
  for(let p=0;p<N;){let q=p;while(q<N&&sc[idx[q]]===sc[idx[p]])q++;const v=(p+(q-p-1)/2)/(N-1);for(let t=p;t<q;t++)hs[idx[t]]=v;p=q;}
  if(nb<5){
    let bm=0;const bs=[0,0,0,0];board.forEach(c=>{bm|=1<<(c>>2);bs[c&3]++;});
    const boardOuts=outRanks(bm);
    for(const i of idx){const a=CA[i],b=CB[i];const cat=sc[i]>>20;
      if(cat<5){for(let s=0;s<4;s++){const n=bs[s]+((a&3)===s?1:0)+((b&3)===s?1:0);if(n===4&&((a&3)===s||(b&3)===s))fd[i]=1;}}
      if(cat<4){const m=bm|(1<<(a>>2))|(1<<(b>>2));const o=outRanks(m)&~boardOuts;const n=popc(o);if(n>=2)oe[i]=1;else if(n===1)gs[i]=1;}}
  }
  F={hs,fd,oe,gs,sc,valid};_featCache.set(key,F);if(_featCache.size>200)_featCache.delete(_featCache.keys().next().value);return F;
}
function popc(x){let n=0;while(x){x&=x-1;n++;}return n;}

'use strict';
const STREETS=['preflop','flop','turn','river'];
const TREMBLE=0.03, TEMPER=0.6, PROFILE_FLOOR=0.02;
const UNIFORM_PRIOR={nit:0.25,tag:0.25,lag:0.25,station:0.25};
const fmt=x=>{if(x==null||isNaN(x))return'–';const r=Math.round(x*10)/10;return(Math.abs(r-Math.round(r))<1e-9?Math.round(r):r.toFixed(1)).toString();};

/* ---------- hand records (only what was public, plus the hero's own cards) ---------- */
function makeRecord(g,heroSeat){
  const net={};g.s.forEach(x=>net[x.seat]=g.players[x.seat].stack-x.start);
  return{hand:g.handNo,at:Date.now(),button:g.button,heroSeat,
    players:g.s.map(x=>({name:x.name,seat:x.seat,start:x.start,pos:g.pos(x.seat)})),
    hole:g.s[heroSeat].hole.slice(),board:g.board.slice(),log:g.log.map(e=>({...e})),
    dec:g.decisions.map(d=>({seat:d.seat,logIdx:d.logIdx,street:d.street,sit:d.sit})), // bot's sampled key is NOT stored
    shown:{...g.shown},result:{type:g.result.type,pots:g.result.pots.map(p=>({amount:p.amount,winners:p.winners})),net},
    snaps:g.heroDecisions.map(s=>({...s})),ll:{}};

/* ---------- mapping a public action to a policy key ---------- */
function publicKey(e,sit){
  if(e.type==='fold')return'fold';if(e.type==='check')return'check';if(e.type==='call')return'call';
  if(sit.street===0)return'raise';
  if(e.type==='bet')return(e.amount/Math.max(1,sit.pot))<0.5?'betS':'betL';
  return'raise';

function keyProb(d,key,sit){
  let p=key==='check'?(d.check!=null?d.check:d.fold+d.call):(d[key]||0);
  const n=sit.toCall>0?(sit.canRaise?3:2):(sit.street===0?(sit.canRaise?2:1):(sit.canBet?3:1));
  return(1-TREMBLE)*p+TREMBLE/n;

function likelihoodVec(M,sit,key){

  return out;
}

/* ---------- public range model: mixture over player types ---------- */
function rangeModel(rec,seat,uptoLog,dead,prior,profiles){
  profiles=profiles||PROFILE_IDS;prior=prior||UNIFORM_PRIOR;
  const decs=rec.dec.filter(d=>d.seat===seat&&d.logIdx<uptoLog);
  const blk=blockedMask(dead),W={};
  for(const p of profiles){W[p]=new Float64Array(NC);for(let i=0;i<NC;i++)W[p][i]=blk[i]?0:1;}

    return{mix,post,byP:Object.fromEntries(profiles.map(p=>[p,W[p].slice()]))};};
  const steps=[{entry:null,...snap()}];
  for(const d of decs){const e=rec.log[d.logIdx],key=publicKey(e,d.sit);
    for(const p of profiles){const L=likelihoodVec(PROFILES[p],d.sit,key),w=W[p];for(let i=0;i<NC;i++)w[i]*=L[i];}
    steps.push({entry:e,sit:d.sit,key,...snap()});}

    return out;}

  const nValid=NC-sum(m.blk);

function profilePrior(name,records){
  const ll={nit:0,tag:0,lag:0,station:0};let n=0;
  for(const r of records)if(r.ll&&r.ll[name]){n++;for(const p of PROFILE_IDS)ll[p]+=r.ll[name][p];}
  const mx=Math.max(...PROFILE_IDS.map(p=>ll[p]));const o={};let z=0;

/* ---------- per-class views ---------- */
function classStats(w,blk){const mass=new Float64Array(169),avail=new Int16Array(169);

  let mx=0;const freq=new Float64Array(169);for(let k=0;k<169;k++){freq[k]=avail[k]?mass[k]/avail[k]:0;mx=Math.max(mx,freq[k]);}

const PRE_BUCKETS=['Pairs','Ace-x','Broadways','Suited connectors','Other'];
const POST_BUCKETS=['Two pair or better','Top pair / overpair','Weaker pair','Draw','Air / overcards'];

/* ---------- questions (2–3, one at a time) ---------- */
function makeQuestions(R){
  const{snap,spot,pm}=R,Q=R.questions,st=STREETS[snap.street];
  if(spot==='post-facing'||spot==='pre-facing'){
    Q.push({kind:'potprice',skills:['pot','price'],title:'Count the pot and the price',
      fields:[{id:'call',label:'How many more chips do you need to call?',unit:'chips',ans:pm.toCall,tol:0.5,skill:'pot'},
              {id:'potAfter',label:pm.sidePot?'How big is the pot you can win after your call?':'How big is the pot after your call?',unit:'chips',ans:pm.sidePot?pm.elig:pm.potAfter,alt:pm.potAfter,tol:0.5,skill:'pot'},
              {id:'be',label:'How often do you need to win for calling to break even?',unit:'%',ans:pm.breakEven*100,tol:1.5,skill:'price'}]});
  }else{
    const b=R.betSize,be=b/(pm.potNow+b);R.bluffBE=be;
    Q.push({kind:'potprice',skills:['pot','price'],title:'Count the pot and the price',
      fields:[{id:'potNow',label:'How big is the pot right now?',unit:'chips',ans:pm.potNow,tol:0.5,skill:'pot'},
              {id:'be',label:spot==='rfi'?`If you raise to ${R.openTo} (${b} more), how often must everyone fold for a pure steal to break even?`:`If you bet ${b}, how often must he fold for a pure bluff to break even?`,unit:'%',ans:be*100,tol:1.5,skill:'price'}]});
  }
  if(R.villain!=null&&R.line&&R.line.length){
    if(spot==='post-open'){
      Q.push({kind:'range',mode:'call',skills:['range'],title:'Infer a range',
        prompt:`${R.vname} has chosen to ${joinPhrases(R.line.map(x=>x.phrase))}. Which of his hands would call a ${R.betSize}-chip bet now? Which of those do you beat?`});
    }else{
      const last=R.line[R.line.length-1].phrase;
      Q.push({kind:'range',mode:'line',skills:['range'],title:'Infer a range',
        prompt:`Which hands would ${joinPhrases(R.line.map(x=>x.phrase))}?`,lessPrompt:`Which got less likely after he chose to ${last}?`,last});
    }
  }
  const opts=spot==='post-facing'||spot==='pre-facing'?['fold','call'].concat(snap.canRaise?['raise']:[]):spot==='rfi'?['fold','call','raise']:['check','bet'];
  let est;
  if(spot==='post-facing')est=snap.street===3?{label:'How often is he bluffing — what share of his bets do you beat?',kind:'q'}:{label:'Your equity against his range',kind:'q'};
  else if(spot==='pre-facing')est={label:'Your equity against his range',kind:'q'};
  else if(spot==='post-open')est={label:`How often would he fold to your bet? (If you check, answer for a ${R.betSize}-chip bet.)`,kind:'f'};
  else est={label:'How often will everyone behind fold to your raise?',kind:'f'};
  Q.push({kind:'play',skills:['play'],title:'Choose and defend a play',opts,est,
    prompt:spot==='rfi'?'What do you do? Give a size if you raise, your estimate, and why.':'What do you do? Give a size if you bet or raise, your estimate, and why.'});
}

/* ---------- grading: pot & price ---------- */
function gradePotPrice(R,q,vals){
  const res={fields:{},skills:{}};
  for(const f of q.fields){const v=parseFloat(vals[f.id]);let ok=!isNaN(v)&&Math.abs(v-f.ans)<=f.tol;let note='';
    if(!ok&&f.alt!=null&&!isNaN(v)&&Math.abs(v-f.alt)<=f.tol){ok=true;note='That counts every chip in the middle; the part you can win is '+fmt(f.ans)+' because of the side pot.';}
    if(!ok&&f.id==='be'&&!isNaN(v)){const C=R.pm.toCall||R.betSize,base=R.pm.toCall?R.pm.potNow:R.pm.potNow;const wrong=C/base*100;
      if(Math.abs(v-wrong)<=f.tol)note=`You divided by the pot before ${R.pm.toCall?'your call':'your bet'} (${fmt(wrong)}%). Break-even divides by the pot after it.`;}
    res.fields[f.id]={ok,v,ans:f.ans,note};res.skills[f.skill]=(res.skills[f.skill]!==false)&&ok;}
  return res;
}

/* ---------- grading: ranges ---------- */
function rangeTargets(R,mode){
  const m=R.model,byP={};let target;

    const cont=continueProbs(R);R.cont=cont;

    for(const p of PROFILE_IDS){const w=new Float64Array(NC);for(let i=0;i<NC;i++)w[i]=m.byP[p][i]*cont.byP[p][i];byP[p]=w;}

}
function histSim(t,u,blk){ // histogram intersection of class-level combo mass

  for(const p of PROFILE_IDS)if(R.model.post[p]>=0.1)hyps.push({id:p,label:`If he is a ${PROFILES[p].label.toLowerCase()} (${pct(R.model.post[p],0)} likely)`,w:byP[p],post:R.model.post[p]});

    const worse=new Float64Array(169),better=new Float64Array(169);

function snapBoardAt(R,stepIdx){const st=R.model.steps[stepIdx];return st&&st.sit&&st.sit.board?st.sit.board:R.snap.board;}

/* ---------- analysis: GTO reference + opponent-specific adjustment ---------- */
function analyze(R){

    const pe=pairEquities(snap.hole,snap.board,R.model.mix,hashStr(R.id));R.eq=pe.eq;A.runs=pe.runs;
    A.eqModel=eqVs(pe.eq,R.model.mix);
  }

    const C=pm.toCall,E=pm.elig;A.param='q';A.threshold=C/E;
    A.ev=q=>q*E-C;
    const river=snap.street===3;A.paramLabel=river?'share of his bets you beat':'your equity vs his range';
    // evidence: comparable bets this street
    const o=R.obs,curFrac=(snap.currentBet-0)/Math.max(1,pm.potNow-snap.currentBet+snap.seats[snap.heroSeat].committed);
    const comp=o?o.betRec.filter(b=>b.street===snap.street&&sizeBucket(b.frac)===sizeBucket(curFrac)):[];
    A.evidence={n:comp.length,sd:comp.filter(b=>b.shown).length,bluffs:comp.filter(b=>b.kind==='bluff'||(snap.street<3&&b.kind==='semi-bluff')).length,
      all:o?o.betRec.filter(b=>b.street===snap.street).length:0,list:comp,street:STREETS[snap.street],size:sizeBucket(curFrac)};
    if(snap.street===0&&o)A.evidence={pre:true,hands:o.hands,vpip:o.vpip,pfr:o.pfr};
    const q0=A.eqModel,n0=4;
    if(river){const ev=A.evidence,a=n0*q0+ev.bluffs,b=n0*(1-q0)+(ev.sd-ev.bluffs);A.belief=betaInterval(Math.max(0.05,a),Math.max(0.05,b));A.beliefSource=`Model prior ${pct(q0,0)} (weight of ${n0} showdowns) updated with ${ev.sd} comparable showdown${ev.sd===1?'':'s'}, ${ev.bluffs} of them bluffs.`;}
    else{A.belief={mean:q0,lo:Math.max(0,q0-0.08),hi:Math.min(1,q0+0.08)};A.beliefSource=`Equity of your hand against the model range (${A.runs} sampled run-outs per hand; ±8 points for sampling and model error).`;}
    A.best=A.ev(A.belief.mean)>0?'call':'fold';
    A.tie=Math.abs(A.ev(A.belief.mean))<0.01*E;
    // value / bluff-candidate split at the start of this street (river only)
    if(river&&R.model.steps.length>=2){const st=R.model.steps;let j=st.length-1;while(j>0&&st[j].entry&&st[j].entry.street===3)j--;
      const before=st[j].mix,after=R.model.mix;let V=0,B=0,Vb=0,Bb=0;
      for(let i=0;i<NC;i++){const e=R.eq[i];if(!(before[i]>0)||isNaN(e))continue;const beat=e;V+=before[i]*(1-beat);B+=before[i]*beat;Vb+=after[i]*(1-beat);Bb+=after[i]*beat;}
      const z=V+B;A.split={valueShare:V/z,betValue:V>0?Vb/V:0,betBluff:B>0?Bb/B:0};}
  }else if(spot==='post-open'){
    Object.assign(A,openSpot(R,R.betSize));
    }else{ // rfi
    const P=pm.potNow,b=R.betSize;A.param='f';A.threshold=b/(P+b);
    let f=1;const me=snap.heroSeat,behind=[];const order=PRE_ORDER;const myIdx=order.indexOf(snap.seats[me].pos);

    const prev=[];A.behind=[];
    for(const s of behind){const name=R.rec.players[s].name,pr=profilePrior(name,R.prev||[]);const sit={street:0,role:'vsOpen',pos:snap.seats[s].pos,openerPos:snap.seats[me].pos,toCall:R.openTo-snap.seats[s].committed,canRaise:true};
      let fold=0,z=0;const blk=blockedMask(snap.hole);for(const p of PROFILE_IDS){let fp=0,zp=0;for(let i=0;i<NC;i++){if(blk[i])continue;fp+=preflopDist(PROFILES[p],CCLS[i],sit).fold;zp++;}fold+=pr[p]*fp/zp;z+=pr[p];}
      A.behind.push({name,pos:snap.seats[s].pos,fold:fold/z});f*=fold/z;}
    A.f0=f;A.belief={mean:f,lo:Math.max(0,f-0.12),hi:Math.min(1,f+0.12)};A.beliefSource='Each player behind folding, averaged over the four player types, multiplied together (treats them as independent).';
    A.ev=x=>x*P-(1-x)*b;A.paramLabel='how often everyone folds';A.flip=A.threshold;
    const k=classOfCards(snap.hole[0],snap.hole[1]),w=PROFILES.tag.open[snap.seats[me].pos]?PROFILES.tag.open[snap.seats[me].pos][k]:0;
    A.chart=w;A.best=A.ev(A.belief.mean)>0?'raise':(w>=0.5?'raise':'fold');A.tie=false;

}
function openSpot(R,b){

  const saved=R.betSize;R.betSize=b;const cont=continueProbs(R);R.betSize=saved;if(b===R.betSize)R.cont=cont;
  const order=[];for(let i=0;i<NC;i++)if(R.model.mix[i]>0&&!isNaN(R.eq[i]))order.push(i);
  order.sort((x,y)=>cont.mix[y]-cont.mix[x]);
  let z=0;for(const i of order)z+=R.model.mix[i];
  let f0=0;for(const i of order)f0+=R.model.mix[i]*(1-cont.mix[i]);f0/=z||1;A.f0=f0;

}
function findFlip(fn){let prev=fn(0);for(let k=1;k<=200;k++){const x=k/200,v=fn(x);if((v>0)!==(prev>0)){let lo=(k-1)/200,hi=x;for(let t=0;t<30;t++){const m=(lo+hi)/2;if((fn(m)>0)===(prev>0))lo=m;else hi=m;}return(lo+hi)/2;}prev=v;}return null;}

/* ---------- GTO reference: heads-up river, restricted tree ---------- */
function riverGTO(R){
  const{snap,rec,pm}=R,me=snap.heroSeat,v=R.villain;
  const no=why=>({available:false,why});
  if(snap.street!==3)return no('The reference library covers heads-up river spots only.');
  if(!R.heads||v==null)return no('Multiway pots are not covered.');
  if(snap.raisesStreet>1)return no('A raise on the river is outside the restricted tree (no raises).');
  const facing=snap.toCall>0;
  const oop=firstPostflopActor(snap.button,me,v),heroOOP=oop===me;
  const node=facing?(heroOOP?'vsBetAfterCheck':'vsBet'):(heroOOP?'root':'afterCheck');
  const hv=snap.seats[me],vv=snap.seats[v];
  const P=pm.potNow-snap.seats.reduce((a,x)=>a+x.committed,0);
  const eff=Math.min(hv.stack+hv.committed,vv.stack+vv.committed);
  let b=facing?vv.committed:(R.heroAction==='bet'&&R.heroBet?R.heroBet:Math.round(0.75*P));
  b=Math.max(1,Math.min(b,eff));
  if(eff<=0)return no('No chips left to bet on the river.');
  const riverStart=rec.log.findIndex(e=>e.type==='deal'&&e.street===3)+1;
  const board=snap.board;
  const vm=rangeModel(rec,v,riverStart,board,R.prior);
  const hm=rangeModel(rec,me,riverStart,board,{tag:1},['tag']);
  const prune=(w,keep)=>{const idx=[];for(let i=0;i<NC;i++)if(w[i]>0)idx.push(i);idx.sort((a,b)=>w[b]-w[a]);const tot=idx.reduce((a,i)=>a+w[i],0);
    const out=[];let acc=0;for(const i of idx){if(out.length>=160||acc>=0.995*tot)break;out.push(i);acc+=w[i];}
    if(keep!=null&&!out.includes(keep)){out.push(keep);}const mx=w[out[0]]||1;
    return out.map(i=>({i,w:i===keep?Math.max(w[i],0.002*mx):w[i]}));};

  const side=x=>({w:x.map(o=>o.w),cards:x.map(o=>[CA[o.i],CB[o.i]]),score:x.map(o=>evalHand([CA[o.i],CB[o.i],...board])),idx:x.map(o=>o.i)});

  const spec={P,b,iters:500,oopCanBet:true,ipCanBet:true,oop:heroOOP?H:V,ip:heroOOP?V:H};
  const t0=Date.now(),sol=solveRiver(spec),ms=Date.now()-t0;

  else freq={bet:sol.ip.bet[hi],check:1-sol.ip.bet[hi]};
  const acts=Object.keys(freq);let credit=[];
  if(ev){const bestEV=Math.max(...acts.map(x=>ev[x]));credit=acts.filter(x=>freq[x]>=0.2||bestEV-ev[x]<=0.01*P);}else credit=acts.filter(x=>freq[x]>=0.2);

  let eqBluffShare=null;

    const hs=evalHand([...snap.hole,...board]);

/* ---------- grading: the play ---------- */
function gradePlay(R,ans){
  const A=analyze(R),out={};const act=ans.action;
  const est=isNaN(parseFloat(ans.estimate))?null:parseFloat(ans.estimate)/100;out.est=est;
  const cont=act==='call'||act==='raise';const evOf=x=>A.ev(x);
  if(A.param==='q'){
    const mine=est!=null?evOf(est):null;out.mineEV=mine;out.consistent=est==null?null:((mine>0)===cont||Math.abs(mine)<0.01*R.pm.elig);
    out.half=est!=null?{x:est/2,ev:evOf(est/2)}:null;
  }else{
    const mine=est!=null?evOf(est):null;out.mineEV=mine;const aggressive=act==='bet'||act==='raise';out.consistent=est==null?null:((mine>0)===aggressive||Math.abs(mine)<0.01*R.pm.potNow);
    out.half=est!=null?{x:est/2,ev:evOf(est/2)}:null;
  }
  if(R.spot==='post-open'&&act==='bet'&&+ans.size>0&&Math.round(+ans.size)!==R.betSize&&R.model){
    const b=Math.min(Math.round(+ans.size),R.snap.maxTo),S2=openSpot(R,b),f=est!=null?est:S2.belief.mean,ev=S2.ev(f);
    out.atSize={b,ev,text:`with ${pct(f,0)} folds, betting ${b} is worth ${sgn2(ev)} chips vs checking; a pure bluff of this size needs ${pct(S2.threshold,1)} folds.`};
    out.consistent=est==null?null:((ev>0)||Math.abs(ev)<0.01*R.pm.potNow);out.mineEV=ev;}
  const adjAct=A.best,norm=a=>a==='raise'&&A.param==='q'?'call':a;
  out.adjOK=norm(act)===adjAct||A.tie;
  out.gtoOK=A.gto.available?A.gto.credit.map(norm).includes(norm(act)):null;
  out.ok=out.adjOK||out.gtoOK===true;
  out.rubric=rubric(ans.reason,'play');
  return out;
}

const sgn2=x=>(x>=0?'+':'−')+fmt(Math.abs(x));
/* ---------- takeaway: one line to use at the table ---------- */
function takeaway(R){
  const A=analyze(R),res=R.results,pm=R.pm;
  if(res.potprice&&res.potprice.skills.price===false){
    return pm.toCall?`Break-even = call ÷ pot after your call: ${pm.toCall} ÷ ${fmt(pm.elig)} = ${pct(pm.breakEven)}. Facing a ¾-pot bet that is always 30%.`:`A pure bluff needs folds = bet ÷ (pot + bet): ${R.betSize} ÷ ${fmt(pm.potNow+R.betSize)} = ${pct(R.bluffBE)}.`;}
  if(res.range&&!res.range.ok&&res.range.compAfter){const ca=res.range.compAfter,cb=res.range.compBefore,lab=R.snap.board.length?POST_BUCKETS:PRE_BUCKETS;
    let k=0,d=0;for(let i=0;i<ca.length;i++){const dd=Math.abs(ca[i]-cb[i]);if(dd>d){d=dd;k=i;}}
    return`When he chose to ${R.questions.find(q=>q.kind==='range').last}, “${lab[k].toLowerCase()}” went from ${pct(cb[k],0)} to ${pct(ca[k],0)} of his range. Shift your read that way next time.`;}
  if(A.param==='q'&&R.snap.street===3){const ev=A.evidence;

    return ev.sd<3?`${shown}, so the read rests on his line and the price. You need ${pct(A.threshold,0)} of these bets to be hands you beat; the range model puts it near ${pct(A.belief.mean,0)}, so ${A.best}${Math.abs(A.belief.mean-A.threshold)<0.1?' — but it is close enough that a small read can flip it':''}.`
      :`${R.vname} has shown ${ev.bluffs} bluff${ev.bluffs===1?'':'s'} in ${ev.sd} comparable river showdowns. Against a ${pct(A.threshold,0)} price, that ${A.belief.mean>A.threshold?'supports calling':'supports folding'} your bluff-catchers.`;}
  if(A.param==='q')return`You need ${pct(A.threshold,0)} equity; the model range gives you about ${pct(A.eqModel,0)}. ${R.snap.street<3?'With streets to come, discount draws that face more bets and add for hands that win big when they hit.':''}`.trim();
  if(A.param==='f'&&R.spot==='post-open'){const valueish=A.flip!=null&&A.ev(Math.max(0,A.flip-0.05))>0;
    return valueish?`This hand bets for value: a ${R.betSize}-chip bet only pays if ${R.vname} calls with worse often enough (folds under ${pct(A.flip,0)}). Name the worse hands that call before you bet.`
      :`A ${R.betSize}-chip bluff needs ${pct(A.threshold,0)} folds; ${R.vname} has folded ${A.evidence.folds} of ${A.evidence.n} ${A.evidence.street} bets you've seen. Bluff when your evidence clears that bar.`;}

}

/* ---------- drills: same skill, new amounts or new cards ---------- */
function makeDrill(item,records){
  const rec=records.find(r=>r.hand===item.hand);
  const rnd=mulberry32(hashStr(item.id+':'+(item.history?item.history.length:0)+':'+Date.now()));
  const pick=a=>a[Math.floor(rnd()*a.length)];
  if((item.skill==='pot'||item.skill==='price')&&rec){
    const snap=rec.snaps[item.k];const lines=[],com=new Array(6).fill(0),tot=new Array(6).fill(0);let cb=0,street=0,nRaise=0;const me=snap.heroSeat;
    const name=s=>s===me?'You':rec.players[s].name+' ('+rec.players[s].pos+')';
    for(let k=0;k<snap.logLen;k++){const e=rec.log[k];
      if(e.type==='deal'){street=e.street;com.fill(0);cb=0;nRaise=0;lines.push({street:STREETS[street],text:`${STREETS[street][0].toUpperCase()+STREETS[street].slice(1)}: ${e.cards.slice(street===1?0:e.cards.length-1).map(c=>(RANKS[c>>2]==='T'?'10':RANKS[c>>2])+({c:'♣',d:'♦',h:'♥',s:'♠'})[SUITS[c&3]]).join(' ')}`,deal:true});continue;}
      const s=e.seat,pot=tot.reduce((a,b)=>a+b,0);let a=0,txt='';const vb=(w,t)=>s===me?w:t||w+'s';
      if(e.type==='sb'||e.type==='bb'){a=e.amount;txt=`${name(s)} ${vb('post')} ${a}`;cb=Math.max(cb,com[s]+a);}
      else if(e.type==='fold'){txt=`${name(s)} ${vb('fold')}`;}
      else if(e.type==='check'){txt=`${name(s)} ${vb('check')}`;}
      else if(e.type==='call'){a=Math.max(0,cb-com[s]);txt=`${name(s)} ${vb('call')} ${a}`;}
      else{let to;if(street===0){to=nRaise===0?pick([4,5,6,7]):Math.round(cb*pick([3,3.5,4]));}else if(cb===0){to=Math.max(2,Math.round(pot*pick([0.33,0.5,0.66,0.75,1,1.25])));}else to=Math.round(cb*pick([2.5,3,3.5]));
        a=to-com[s];txt=`${name(s)} ${cb===0&&street>0?vb('bet'):vb('raise')+' to'} ${cb===0&&street>0?a:to}`;cb=to;nRaise++;}
      com[s]+=a;tot[s]+=a;lines.push({text:txt});}
    const potNow=tot.reduce((a,b)=>a+b,0),toCall=Math.max(0,cb-com[me]);
    const fields=toCall>0?[{id:'call',label:'How many more chips do you need to call?',ans:toCall,tol:0.5,unit:'chips',skill:'pot'},{id:'potAfter',label:'How big is the pot after your call?',ans:potNow+toCall,tol:0.5,unit:'chips',skill:'pot'},{id:'be',label:'Break-even: how often must you win?',ans:toCall/(potNow+toCall)*100,tol:1.5,unit:'%',skill:'price'}]
      :(()=>{const b=Math.max(2,Math.round(potNow*pick([0.33,0.5,0.75,1])));return[{id:'potNow',label:'How big is the pot right now?',ans:potNow,tol:0.5,unit:'chips',skill:'pot'},{id:'be',label:`If you bet ${b}, how often must he fold for a pure bluff to break even?`,ans:b/(potNow+b)*100,tol:1.5,unit:'%',skill:'price'}];})();
    return{kind:'potprice',skill:item.skill,lines,fields:fields.filter(f=>item.skill==='pot'?true:true),title:'Same spot, new amounts',hole:snap.hole};
  }
  if(item.skill==='range'&&rec&&item.villain!=null){
    const snap=rec.snaps[item.k];
    for(let tries=0;tries<20;tries++){
      const deck=[];for(let c=0;c<52;c++)deck.push(c);for(let i=51;i>0;i--){const j=Math.floor(rnd()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}
      const hole=[deck.pop(),deck.pop()],full=[deck.pop(),deck.pop(),deck.pop(),deck.pop(),deck.pop()];
      const board=full.slice(0,snap.board.length);
      const r2={...rec,dec:rec.dec.map(d=>d.street>0?{...d,sit:{...d.sit,board:full.slice(0,d.street+2)}}:d)};
      const prior=profilePrior(rec.players[item.villain].name,records.filter(r=>r.hand<rec.hand));
      const model=rangeModel(r2,item.villain,snap.logLen,hole.concat(board),prior);
      if(sum(model.mix)<=0)continue;
      const fake={rec:r2,snap:{...snap,hole,board},model,prior,line:villainLine(r2,item.villain,snap.logLen),vname:rec.players[item.villain].name,id:item.id+'d'};
      const last=fake.line.length?fake.line[fake.line.length-1].phrase:'act';
      const q={kind:'range',mode:'line',prompt:`New cards, same betting: which hands would ${joinPhrases(fake.line.map(x=>x.phrase))}?`,lessPrompt:`Which got less likely after he chose to ${last}?`,last};
      return{kind:'range',skill:'range',R:fake,q,hole,board,title:'Similar betting, different cards'};
    }
  }
  // play: river bluff-catch with new numbers (always available)
  const P=pick([60,80,100,120,150,200,240]),f=pick([0.33,0.5,0.75,1,1.5]),b=Math.round(P*f);
  const V=pick([0.4,0.5,0.6,0.7]),beta=pick([0.1,0.25,0.4,0.5,0.6,0.8]);
  const share=beta*(1-V)/(V+beta*(1-V));const viaBeta=rnd()<0.6;
  const ev=share*(P+b)-(1-share)*b;
  return{kind:'play',skill:'play',P,b,V,beta,share,viaBeta,ev,title:'River bluff-catch, new numbers',
    text:viaBeta?`Heads-up river. Pot ${P}. He bets ${b}. You hold a pure bluff-catcher: it beats all his bluffs and loses to all his value hands, no ties. He arrives with ${pct(V,0)} value hands and ${pct(1-V,0)} bluff candidates. He bets every value hand and ${pct(beta,0)} of his bluff candidates.`
      :`Heads-up river. Pot ${P}. He bets ${b}. You hold a pure bluff-catcher. From what you have seen, ${pct(share,0)} of his bets here are bluffs.`};
}
function gradeDrillPlay(d,ans){
  const act=ans.action,ev=parseFloat(ans.ev);const best=Math.abs(d.ev)<1?'either':d.ev>0?'call':'fold';
  const actOK=best==='either'||act===best,evOK=!isNaN(ev)&&Math.abs(ev-d.ev)<=Math.max(2,Math.abs(d.ev)*0.05);
  return{actOK,evOK,ok:actOK&&evOK,best,ev:d.ev,share:d.share,be:d.b/(d.P+2*d.b)};

function verb(who,base,third){return who==='You'?base:third||base+'s';}
function logLine(e,players,hero=0){
  if(e.type==='deal')return null;const who=e.seat===hero?'You':players[e.seat].name;
  switch(e.type){case'sb':return`${who} post${who==='You'?'':'s'} the small blind`;case'bb':return`${who} post${who==='You'?'':'s'} the big blind`;
    case'fold':return`${who} ${verb(who,'fold')}`;case'check':return`${who} ${verb(who,'check')}`;
    case'call':return`${who} ${verb(who,'call')}${e.allIn?' (all-in)':''}`;
    case'bet':return`${who} ${verb(who,'bet')}${e.allIn?' all-in':''}`;
    case'raise':return`${who} ${verb(who,'raise')} to ${e.to}${e.allIn?' (all-in)':''}`;}
  return'';
}
function logHTML(log,players,upto,hero=0,cls='loglist'){
  let h='';const n=upto==null?log.length:upto;
  for(let k=0;k<n;k++){const e=log[k];
    if(e.type==='deal'){h+=`<li class="st">${STREETS[e.street][0].toUpperCase()+STREETS[e.street].slice(1)} ${cardsXS(e.street===1?e.cards:e.cards.slice(-1))}</li>`;continue;}
    const amt=e.type==='raise'?'':e.amount?e.amount:'';
    h+=`<li class="${e.seat===hero?'me':''}"><span>${esc(logLine(e,players,hero))}</span><span class="amt">${amt}</span></li>`;}
  return`<ul class="${cls}">${h}</ul>`;
}

function startReview(rec,k,fromBlock,blockHands){
  clearTimer();
  if(fromBlock&&!blockHands){blockHands=tableHands().filter(r=>r.hand>S.blockStart);S.blockStart=Math.max(...tableHands().map(r=>r.hand));}
  let R;try{R=buildReview(rec,k,HANDS.filter(h=>h.tableId===rec.tableId));}catch(e){console.error(e);toast('Could not build that review.');dealHand();return;}
  UI.review={R,qi:-1,fromBlock,blockHands:blockHands||null};
  UI.mode='review';S.pending={tableId:rec.tableId,hand:rec.hand,k};save();render();
}
function decisionLabel(rec,snap){const pos=snap.seats[snap.heroSeat].pos;return`${STREETS[snap.street]}, ${pos}, ${cardTxt(snap.hole[0])}${cardTxt(snap.hole[1])} — you ${snap.action?snap.action.type+(snap.action.type==='raise'?' to '+snap.action.to:snap.action.type==='bet'?' '+snap.action.amount:''):'acted'}`;}
function steps(R,qi){return`<div class="steps">${R.questions.map((q,i)=>`<i class="${i<qi?'done':i===qi?'on':''}"></i>`).join('')}<i class="${qi>=R.questions.length?'on':''}"></i></div>`;}
function histBox(R){return`<div class="histline">${logHTML(R.rec.log,R.rec.players.map((x,i)=>({name:i===0?'You':x.name})),R.snap.logLen,0,'loglist')}</div>`;}
function renderCoach(){
  const el=$('#coach'),V=UI.review,R=V.R,snap=R.snap;
  if(V.qi===-1){
    const vil=R.villain!=null?`${esc(R.vname)} (${snap.seats[R.villain].pos})`:'the players behind you';
    const others=V.blockHands?V.blockHands.flatMap(r=>r.snaps.map((s,k)=>({r,s,k,sc:interest(r,s)}))):[];
    el.innerHTML=`<h2>Rewind: hand #${R.rec.hand}, ${STREETS[snap.street]}</h2>
      <p class="sub">You held ${cardsXS(snap.hole)} in the ${snap.seats[0].pos}${snap.board.length?' on '+cardsXS(snap.board):''}. The decision is about ${vil}. You'll answer ${R.questions.length} short questions using only what you knew then. Nothing is revealed before you answer.</p>
      ${steps(R,-1)}<h3>Action before your decision</h3>${histBox(R)}
      <div class="rowbtns"><button class="go" id="startQ">Start</button><button class="ghost" id="defer">Defer this review</button></div>
      ${''}${others.length>1?`<h3>Or pick another decision from these hands</h3><ul class="declist">${others.map(o=>`<li><button data-h="${o.r.hand}" data-k="${o.k}" class="${o.r.hand===R.rec.hand&&o.k===R.k?'pick':''}">#${o.r.hand} · ${esc(decisionLabel(o.r,o.s))}${o.s.flagged?' · flagged':''}</button></li>`).join('')}</ul>`:''}`;
    el.querySelectorAll('.histline').forEach(x=>x.scrollTop=x.scrollHeight);
    $('#startQ').onclick=()=>{V.qi=0;render();};
    $('#defer').onclick=()=>{S.deferred.push({tableId:R.rec.tableId,hand:R.rec.hand,k:R.k,label:decisionLabel(R.rec,snap)});S.pending=null;save();toast('Saved for later — find it under Progress.');dealHand();};
    el.querySelectorAll('button[data-h]').forEach(b=>b.onclick=()=>{const r=tableHands().find(x=>x.hand===+b.dataset.h);startReview(r,+b.dataset.k,true,V.blockHands);});
    return;}
  if(V.qi<R.questions.length){renderQuestion(el,R,R.questions[V.qi],V.qi);return;}
  renderSummary(el,R);
}

      <div id="sizeRow" ${(ans.action==='bet'||ans.action==='raise')?'':'hidden'}><label for="psize">${R.snap.toCall>0||R.spot==='rfi'?'Raise to':'Bet'} (legal: ${R.snap.toCall>0||R.spot==='rfi'?L.minTo:Math.max(2,L.minTo)}–${R.snap.toCall>0||R.spot==='rfi'?L.maxTo:L.maxTo-R.snap.seats[0].committed})</label><div class="inrow"><input type="number" id="psize" value="${esc(ans.size||'')}" ${done?'disabled':''}><span>chips</span></div></div>
      <label for="pest">${esc(q.est.label)}</label><div class="inrow"><input type="number" id="pest" min="0" max="100" step="any" value="${esc(ans.estimate==null?'':ans.estimate)}" ${done?'disabled':''}><span>%</span></div>
      <label for="preason">Why?</label><textarea id="preason" ${done?'disabled':''} placeholder="Price, his range, what you've seen from him">${esc(ans.reason||'')}</textarea>
      ${done?'':'<button class="go" id="pgo">Submit my play</button>'}</div>`;
    if(done)h+=playFeedback(R,done);
  }
  if(done)h+=`<div class="rowbtns"><button class="go" id="nextQ">${qi+1<R.questions.length?'Next question':'See the calculation and takeaway'}</button></div>`;
  el.innerHTML=h;el.scrollTop=0;el.querySelectorAll('.histline').forEach(x=>x.scrollTop=x.scrollHeight);
  if(q.kind==='potprice'&&!done)$('#qf').onsubmit=e=>{e.preventDefault();const vals={};q.fields.forEach(f=>vals[f.id]=$('#f_'+f.id).value);

      heat:done?done.g.T.rel:null,onChange:st=>{UI.review.gridState=st.w;}});
    if(!done)$('#rgo').onclick=()=>{const u=G2.weights(),dn=G2.downs();if(u.every(x=>x===0)){toast('Select at least a few hands first.');return;}
      const g=gradeRange(R,q,u,dn);R.results.range={user:Array.from(u),down:Array.from(dn),text:$('#rtxt').value,g,ok:g.ok};
      recordSkill('range',g.ok,R,{credit:+g.credit.toFixed(2),text:$('#rtxt').value.slice(0,300)});render();};

    const d=UI.review.draft=UI.review.draft||{};
    el.querySelectorAll('#pchoice button').forEach(b=>b.onclick=()=>{d.action=b.dataset.o;el.querySelectorAll('#pchoice button').forEach(x=>x.classList.toggle('on',x===b));$('#sizeRow').hidden=!(d.action==='bet'||d.action==='raise');});
    $('#pgo').onclick=()=>{d.size=$('#psize').value;d.estimate=$('#pest').value;d.reason=$('#preason').value;
      if(!d.action){toast('Choose an action first.');return;}if(d.estimate===''){toast('Give your estimate — it is what the coach tests your play against.');return;}
      if((d.action==='bet'||d.action==='raise')&&!(+d.size>0)){toast('Give a size for your bet or raise.');return;}
      const g=gradePlay(R,{...d});R.results.play={ans:{...d},g};recordSkill('play',g.ok,R,{action:d.action,size:d.size,estimate:d.estimate,reason:(d.reason||'').slice(0,300)});render();};

function verdict(ok,txtOk,txtNo,mid){return`<div class="v">${ok===null?mid||'':ok?txtOk:txtNo}</div>`;}
function potFeedback(R,q,r){
  const pm=R.pm;let h='';
  const allOK=Object.values(r.fields).every(x=>x.ok);
  h+=`<div class="fb ${allOK?'ok':'no'}">${verdict(allOK,'All correct','Not quite')}`;
  for(const f of q.fields){const x=r.fields[f.id];h+=`<div style="font:500 15px var(--f-num)">${esc(f.label)} <b>${fmt(x.ans)}${f.unit==='%'?'%':''}</b> — you said ${isNaN(x.v)?'nothing':fmt(x.v)+(f.unit==='%'?'%':'')} ${x.ok?'✓':'✗'}${x.note?`<br><span class="sub">${esc(x.note)}</span>`:''}</div>`;}
  h+=`</div><h3>The calculation</h3>`;
  for(const ln of R.breakdown)h+=`<div class="calc"><b>${ln.street[0].toUpperCase()+ln.street.slice(1)}${ln.current?' (so far)':''}:</b> ${ln.parts.map(p=>`${esc(p.who)} ${p.a}${p.folded?' (folded)':''}`).join(' + ')} = ${ln.total} → pot ${ln.running}</div>`;
  if(pm.toCall>0){
    h+=`<div class="calc">You had ${R.snap.seats[0].total} in already and needed <b>${pm.toCall}</b> more. Pot after your call: ${pm.potNow} + ${pm.toCall} = <b>${pm.potAfter}</b>${pm.sidePot?`; you can win only <b>${pm.elig}</b> of it (the rest is a side pot you can't match)`:''}.</div>
      <div class="calc">Break-even = amount to call ÷ pot after your call = ${pm.toCall} ÷ ${pm.elig} = <b>${pct(pm.breakEven)}</b>. Ties count as your share of the pot when you estimate how often you win.</div>`;
    if(R.snap.street<3)h+=`<p class="sub">On the ${STREETS[R.snap.street]} this is a floor, not the whole story. ${R.snap.street===0?'You still have to play the flop, turn and river':'Bets on later streets will make you pay again'}: draws and weak pairs often fail to reach showdown, and hands that make the nuts can win more. With ${Math.min(...R.snap.seats.filter(x=>!x.folded).map(x=>x.stack))} chips behind, the stack-to-pot ratio is ${(Math.min(...R.snap.seats.filter(x=>!x.folded).map(x=>x.stack))/Math.max(1,pm.potAfter)).toFixed(1)}.</p>`;
  }else{
    h+=`<div class="calc">${R.spot==='rfi'?`Raising to ${R.openTo} costs ${R.betSize} more.`:`A ${R.betSize}-chip bet.`} A pure bluff breaks even when folds × pot = calls × bet, so folds needed = ${R.betSize} ÷ (${pm.potNow} + ${R.betSize}) = <b>${pct(R.bluffBE)}</b>.</div>`;
  }
  return h;
}
function rangeFeedback(R,q,r){
  const g=r.g,lab=k=>CLASS_LABELS[k],chips=(ks,cls,extra)=>ks.length?ks.slice(0,18).map(k=>`<span class="chipk ${cls}">${lab(k.k!=null?k.k:k)}${extra?extra(k):''}</span>`).join('')+(ks.length>18?` <span class="sub">+${ks.length-18} more</span>`:''):'<span class="sub">none</span>';
  let h=`<div class="fb ${g.ok?'ok':g.credit>=0.35?'mid':'no'}">${verdict(g.ok,'Well-supported read','Off the mark',null)}${!g.ok&&g.credit>=0.35?'<div class="v">Partly right</div>':''}
    <div style="font:500 15px var(--f-num)">Overlap with the best-matching plausible range: <b>${pct(g.credit,0)}</b> (${esc(g.best.label)}).</div>
    <div class="sub">Dark cells = the model range (darker = more likely); red outline = your picks. Hatched cells are impossible given the cards you can see.</div></div>`;
  h+=`<div class="kv" style="margin:8px 0"><dt>Impossible</dt><dd>${chips(g.cat.impossible,'imp')}</dd><dt>Questionable</dt><dd>${chips(g.cat.questionable,'q')}</dd>
    <dt>Plausible alternative</dt><dd>${chips(g.cat.alternative,'alt',x=>' · '+PROFILES[x.p].label.toLowerCase())}</dd><dt>Well-supported</dt><dd>${chips(g.cat.supported,'ok')}</dd><dt>Left out</dt><dd>${chips(g.cat.missed,'miss')}</dd></div>`;
  if(g.cat.impossible.length)h+=`<p class="sub">Impossible: with ${cardsXS(R.dead)} visible, no combination of those hands is left.</p>`;
  if(g.compAfter){const L=R.snap.board.length?POST_BUCKETS:PRE_BUCKETS;
    h+=`<h3>What “${esc(q.last)}” changed</h3><div class="compbars">${L.map((n,i)=>`<div class="bar"><span>${n}</span><span class="tr"><i class="alt" style="width:${(g.compBefore[i]*100).toFixed(1)}%"></i></span><span class="n">${pct(g.compBefore[i],0)}</span></div><div class="bar"><span></span><span class="tr"><i style="width:${(g.compAfter[i]*100).toFixed(1)}%"></i></span><span class="n">→ ${pct(g.compAfter[i],0)}</span></div>`).join('')}</div>
      <p class="sub">Grey = his range before that action, dark = after. Hands that got least likely: ${chips(g.less.slice(0,10),'')}${g.downMarked&&g.downMarked.length?`<br>Your ↓ marks: ${g.downHits.length} of ${g.downMarked.length} really did get less likely.`:''}</p>`;
    if(g.support&&g.support.length)h+=`<h3>Which actions support your read</h3>${g.support.map(s=>{const d=s.keptUser-s.keptModel;return`<div class="calc">${esc(s.phrase[0].toUpperCase()+s.phrase.slice(1))}: the hands you picked would do this ${pct(s.keptUser,0)} of the time, the model range ${pct(s.keptModel,0)}. ${Math.abs(d)<0.08?'Neutral for your read.':d>0?'This action supports your read.':'This action weakens your read.'}</div>`;}).join('')}`;
  }
  if(g.worse){h+=`<h3>Worse hands that call</h3><p>About ${pct(g.worseShare,0)} of his calling range is hands you beat: ${chips(g.worse.slice(0,14),'ok')}</p><p class="sub">Better hands that continue: ${chips(g.better.slice(0,10),'q')}</p>`;}
  const ru=rubric(r.text,'range');if(r.text&&r.text.trim())h+=`<h3>Your explanation</h3>${ru.map(x=>`<div class="sub">${x.ok?'✓':'•'} ${esc(x.msg)}</div>`).join('')}`;
  return h;
}
function playFeedback(R,d){
  const A=analyze(R),g=d.g,ans=d.ans;let h=`<div class="fb ${g.ok?'ok':'no'}">${verdict(g.ok,'Defensible play','Hard to defend')}`;
  const est=g.est;
  if(est!=null){
    const pLab=A.param==='q'?(R.snap.street===3?'bluffs (hands you beat)':'equity'):'folds';
    h+=`<div style="font:500 15px var(--f-num)">With your estimate of ${pct(est,0)} ${pLab}, ${A.param==='q'?`calling is worth ${sgn(g.mineEV)} chips vs folding`:R.spot==='rfi'?`a pure steal is worth ${sgn(g.mineEV)} chips`:`betting is worth ${sgn(g.mineEV)} chips vs checking`}. ${g.consistent===false?'<b>Your action does not follow from your own estimate.</b>':'Your action follows from your estimate.'}</div>`;
    if(g.half)h+=`<div style="font:500 15px var(--f-num)">If he ${A.param==='q'?'bluffs':'folds'} half as often as you estimated (${pct(g.half.x,0)}): ${sgn(g.half.ev)} chips → ${g.half.ev>0?(A.param==='q'?'still call':'still bet'):(A.param==='q'?'fold':'check')}.</div>`;
  }
  h+=`<div style="font:500 15px var(--f-num)">${esc(flipText(R,A))}</div>`;
  if(g.atSize)h+=`<div style="font:500 15px var(--f-num)">At your size (${g.atSize.b}): ${esc(g.atSize.text)}</div>`;
  h+='</div>';
  return h;
}
const sgn=x=>x==null||isNaN(x)?'–':(x>=0?'+':'−')+fmt(Math.abs(x));
function flipText(R,A){
  if(A.flip==null)return A.ev(0.5)>0?`${A.best} is better at every value of ${A.paramLabel}.`:`${A.best} is better at every value of ${A.paramLabel}.`;
  if(A.param==='q')return`Calling beats folding when ${A.paramLabel} is above ${pct(A.flip,1)}.`;
  const lowGood=A.ev(Math.max(0,A.flip-0.05))>0;
  if(R.spot==='rfi')return`The steal alone pays when everyone folds more than ${pct(A.flip,1)} of the time.`;
  return lowGood?`Betting beats checking only if he folds less than ${pct(A.flip,1)}: this hand bets for value, so it needs calls from worse.`:`Betting beats checking when he folds more than ${pct(A.flip,1)}.`;
}

    pot:pp&&pp.skills.pot!=null?pp.skills.pot:null,price:pp&&pp.skills.price!=null?pp.skills.price:null,slip:!!slip,
    range:rr?{credit:+rr.g.credit.toFixed(2),ok:rr.ok,imp:rr.g.cat.impossible.length,q:rr.g.cat.questionable.length}:null,
    play:pr?{action:pr.ans.action,size:pr.ans.size||null,est:pr.ans.estimate,ok:pr.g.ok,consistent:pr.g.consistent,best:A.best,gto:A.gto.available?pr.g.gtoOK:null}:null,
    takeaway:takeaway(R),net:R.rec.result.net[0]});

}

  if($('#rerun'))$('#rerun').onclick=()=>{R.analysis.gto=riverGTO(R);render();toast('Re-solved: same inputs, same numbers.');};
  $('#dealNext').onclick=()=>finishReview(false);

const normAct=a=>a;
function gtoHTML(R,A){
  const g=A.gto;
  if(!g.available)return`<p class="big" style="font-size:22px">GTO reference unavailable</p><p class="sub">${esc(g.why)} The pot math, range read and opponent adjustment still apply.</p>`;
  const acts=Object.keys(g.freq);
  let h=`<p class="sub" style="margin-top:0">Equilibrium for your exact hand at this point:</p>`;
  h+=acts.map(a=>`<div class="bar"><span style="text-transform:capitalize">${a}</span><span class="tr"><i style="width:${(g.freq[a]*100).toFixed(1)}%"></i></span><span class="n">${pct(g.freq[a],0)}</span></div>`).join('');

function wireAdj(R,A){
  const r=$('#adjR');if(!r)return;

    $('#adjOut').innerHTML=A.param==='q'?`At ${pct(x,0)}: calling is worth ${pct(x,0)} × ${fmt(R.pm.elig-R.pm.toCall)} − ${pct(1-x,0)} × ${R.pm.toCall} = <b>${sgn(ev)}</b> chips vs folding → <b>${Math.abs(ev)<0.01*R.pm.elig?'tied':ev>0?'call':'fold'}</b>.`
      :R.spot==='rfi'?`At ${pct(x,0)} folds: steal EV = ${pct(x,0)} × ${R.pm.potNow} − ${pct(1-x,0)} × ${R.betSize} = <b>${sgn(ev)}</b> (ignores your equity when called).`
      :`At ${pct(x,0)} folds: bet ${sgn(A.evBet(x))}, check ${sgn(A.evCheck())} → <b>${ev>0?'bet':'check'}</b> (difference ${sgn(ev)}; calls come from his strongest hands; checking assumes a showdown).`;};
  r.oninput=out;out();

    const up=()=>{const beta=+b.value/100,s=beta*(1-V)/(v*V+beta*(1-V)||1);$('#betaV').textContent=pct(beta,0);
      $('#betaOut').innerHTML=`The model has him reaching the river with ${pct(V,0)} hands that beat you and betting ${pct(v,0)} of them. Betting ${pct(beta,0)} of the rest makes <b>${pct(s,0)}</b> of his bets hands you beat: ${pct(beta,0)}×${pct(1-V,0)} ÷ (${pct(v,0)}×${pct(V,0)} + ${pct(beta,0)}×${pct(1-V,0)}). Bluff-candidate frequency and bluff share are different numbers.`;
      r.value=Math.round(s*100);out();};
    b.oninput=up;$('#betaV').textContent=pct(+b.value/100,0);}
}
async function askClaude(R,A){
  const box=$('#claudeBox');if(!box)return;

  box.innerHTML=`<div class="cl sub">Claude is assessing your reasoning…</div>`;
  try{const r=await sample(claudePrompt(R,A),{modelTier:'default'});R.claude=(r&&r.text||'').trim();if($('#claudeBox'))$('#claudeBox').innerHTML=R.claude?`<p class="sub" style="margin:10px 0 0">Claude's assessment (uses only what you knew at the time):</p><div class="cl"></div>`:'';const c=$('#claudeBox .cl');if(c)c.textContent=R.claude;}
  catch(e){if($('#claudeBox'))$('#claudeBox').innerHTML=e&&e.code==='not_granted'?'':`<p class="sub">Claude's written assessment isn't available right now; the checks above still apply.</p>`;}

function claudePrompt(R,A){
  const s=R.snap,lines=[];for(let k=0;k<s.logLen;k++){const e=R.rec.log[k];if(e.type==='deal'){lines.push(STREETS[e.street]+': '+e.cards.map(cardStr).join(' '));continue;}lines.push(logLine(e,R.rec.players.map((x,i)=>({name:i===0?'You':x.name})))+(e.amount&&e.type!=='raise'?' '+e.amount:''));}
  const rr=R.results.range,pr=R.results.play,g=rr&&rr.g;
  const top=g?[...Array(169).keys()].filter(k=>rr.user[k]>0).map(k=>CLASS_LABELS[k]+(rr.user[k]<1?'('+rr.user[k]+')':'')).slice(0,60).join(' '):'';
  const comp=R.model?composition(R.model.mix,s.board):null,lab=s.board.length?POST_BUCKETS:PRE_BUCKETS;
  return`You are a poker coach reviewing one decision from a 6-max no-limit hold'em cash game (blinds 1/2 chips). Use ONLY the facts below: they are what the player knew at that moment plus the coach's calculations. Do not invent reads, history or showdown results. Write 70-110 words of plain text, no headings or lists: say what in the reasoning is well supported, point out any impossible card combination or questionable assumption, and give one concrete improvement. Address the player as "you".

FACTS
Hero: ${s.hole.map(cardStr).join(' ')} in the ${s.seats[0].pos}, stack ${s.seats[0].stack}. Street: ${STREETS[s.street]}. Board: ${s.board.map(cardStr).join(' ')||'none'}.
Action so far:
${lines.join('\n')}
Price: ${R.pm.toCall?`call ${R.pm.toCall}, pot after call ${R.pm.elig}, break-even ${pct(R.pm.breakEven)}`:`pot ${R.pm.potNow}; a ${R.betSize}-chip bluff needs ${pct(R.bluffBE)} folds`}.
${R.villain!=null?`Opponent: ${R.vname} (${s.seats[R.villain].pos}), stack ${s.seats[R.villain].stack}. Coach's public range model composition: ${comp?lab.map((n,i)=>n+' '+pct(comp[i],0)).join(', '):'n/a'}.`:''}
Coach's opponent estimate: ${A.paramLabel} ${pct(A.belief.mean,0)} (80% ${pct(A.belief.lo,0)}-${pct(A.belief.hi,0)}); decision switches at ${pct(A.flip,1)}; opponent-specific best: ${A.best}. ${A.beliefSource}
GTO reference: ${A.gto.available?`equilibrium for hero's hand ${Object.entries(A.gto.freq).map(([a,f])=>a+' '+pct(f,0)).join(', ')} (restricted river tree)`:'unavailable for this spot'}.

PLAYER'S ANSWERS
${g?`Range selected: ${top}. Flagged by the coach as impossible: ${g.cat.impossible.map(k=>CLASS_LABELS[k]).join(' ')||'none'}; questionable: ${g.cat.questionable.map(k=>CLASS_LABELS[k]).join(' ')||'none'}; overlap with best plausible range ${pct(g.credit,0)}.
Range explanation: "${(rr.text||'').slice(0,600)}"`:''}
${pr?`Play: ${pr.ans.action}${pr.ans.size?' '+pr.ans.size:''}; estimate ${pr.ans.estimate}%; reasoning: "${(pr.ans.reason||'').slice(0,600)}"`:''}`;
}
function finishReview(drills){

}

/* ---------- skills & queue ---------- */
function recordSkill(skill,ok,R,answer){
  const st=S.skills[skill];st.att++;if(!ok)st.miss++;st.recent.push(ok?1:0);st.recent=st.recent.slice(-12);
  const id=`${R.rec.tableId}:${R.rec.hand}:${R.k}:${skill}`;let it=S.queue.find(x=>x.id===id);
  if(!it){it={id,skill,tableId:R.rec.tableId,hand:R.rec.hand,k:R.k,villain:R.villain,created:Date.now()};S.queue.push(it);}
  it.answer=answer;it.question=(R.questions.find(q=>q.skills.includes(skill))||{}).title;schedule(it,ok,S.handNo);
  if(S.queue.length>200)S.queue=S.queue.slice(-200);save();
}

/* ---------- drills (due reviews with new numbers or cards) ---------- */

/* ---------- range grid widget ---------- */
function makeGrid(host,o){
  const P=classStats(new Float64Array(NC).fill(1),o.blk);
  const w=new Float64Array(169),down=new Uint8Array(169);if(o.init)o.init.forEach((v,k)=>w[k]=v);if(o.initDown)o.initDown.forEach((v,k)=>down[k]=v);
  let brush=1,painting=false,paintVal=null;
  const tools=o.editable?`<div class="tools">${[[1,'100%'],[0.5,'50%'],[0.25,'25%'],[0,'Erase']].map(([v,l])=>`<button type="button" data-b="${v}" class="${v===1?'on':''}">${l}</button>`).join('')}${o.down?'<button type="button" data-b="down">↓ less likely</button>':''}
    <button type="button" data-q="pairs">Pairs</button><button type="button" data-q="ax">Suited aces</button><button type="button" data-q="bw">Broadways</button><button type="button" data-q="sc">Suited connectors</button><button type="button" data-q="clear">Clear</button></div>`:'';
  host.innerHTML=`<div class="gridwrap">${tools}<div class="grid" role="grid" aria-label="Starting hand grid">${CLASS_LABELS.map((l,k)=>{const i=Math.floor(k/13),j=k%13;return`<button type="button" class="cell ${i===j?'pr':i<j?'su':''} ${P.avail[k]===0?'blk':''}" data-k="${k}" title="${l}: ${P.avail[k]} combos available"><span class="fill"></span><span>${l}</span></button>`;}).join('')}</div><div class="legend" id="glg"></div></div>`;
  const cells=host.querySelectorAll('.cell');
  const paint=()=>{let comb=0;cells.forEach((c,k)=>{const f=c.firstChild;
      if(o.heat){const v=o.heat[k];f.style.opacity=(v*0.92).toFixed(2);c.classList.add('heat');c.classList.toggle('sel',v>0.45);c.classList.toggle('ring',w[k]>0);}
      else{f.style.opacity=w[k]?(0.25+0.75*w[k]).toFixed(2):0;c.classList.toggle('sel',w[k]>=0.5);}
      c.classList.toggle('down',!!down[k]);comb+=w[k]*P.avail[k];});
    const lg=host.querySelector('#glg');if(lg)lg.textContent=o.heat?'Darker = more of his range. Red outline = your selection.':`Selected: ${fmt(comb)} combos (${pct(comb/Math.max(1,NC-sum(o.blk)),1)} of hands still possible). Visible cards remove combos; hatched cells have none left.`;
    if(o.onChange)o.onChange({w:Array.from(w)});};
  const apply=(k,first)=>{if(brush==='down'){if(first)paintVal=down[k]?0:1;down[k]=paintVal;}else{if(first)paintVal=w[k]===brush?0:brush;w[k]=paintVal;}paint();};
  if(o.editable){
    host.querySelector('.grid').addEventListener('pointerdown',e=>{const c=e.target.closest('.cell');if(!c)return;e.preventDefault();painting=true;apply(+c.dataset.k,true);});
    host.querySelector('.grid').addEventListener('pointerover',e=>{if(!painting)return;const c=e.target.closest('.cell');if(c)apply(+c.dataset.k,false);});
    window.addEventListener('pointerup',()=>{painting=false;});
    host.querySelector('.grid').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const c=e.target.closest('.cell');if(c){e.preventDefault();apply(+c.dataset.k,true);}}});
    host.querySelectorAll('.tools [data-b]').forEach(b=>b.onclick=()=>{brush=b.dataset.b==='down'?'down':+b.dataset.b;host.querySelectorAll('.tools [data-b]').forEach(x=>x.classList.toggle('on',x===b));});
    host.querySelectorAll('.tools [data-q]').forEach(b=>b.onclick=()=>{const q=b.dataset.q,v=brush==='down'?1:brush;
      for(let k=0;k<169;k++){const i=Math.floor(k/13),j=k%13,hi=12-Math.min(i,j),lo=12-Math.max(i,j);
        const m=q==='clear'?true:q==='pairs'?i===j:q==='ax'?(i===0&&j>0):q==='bw'?(hi>=8&&lo>=8):q==='sc'?(i<j&&hi-lo<=2&&lo>=2):false;
        if(m){if(q==='clear'){w[k]=0;down[k]=0;}else w[k]=v;}}paint();});
  }
  paint();
  return{weights:()=>Float64Array.from(w),downs:()=>Uint8Array.from(down)};
}
